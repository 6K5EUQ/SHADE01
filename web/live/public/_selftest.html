<!doctype html>
<meta charset="utf-8">
<title>SHADE01 라이브 — 자체검사</title>
<!--
  HUD 자체검사. 브라우저로 http://localhost:4400/_selftest.html 를 열면 된다.

  왜 있나: 이 페이지의 검증 실패 비용은 **비행 중**이다. FC 없이는 종횡비·
  이음매·클리핑·부호를 현장에서야 발견한다. 실제로 이 검사가 만들어지면서
  세 가지 실결함이 잡혔다 —
    ① gs<1.5 (정지·호버) 에서 show(null) 이 TypeError 를 던져 render() 가
       중간에 죽고 중앙 상태·스트립·상태밴드가 통째로 안 그려지던 것
    ② 좁은 화면에서 hudBox 가 제 부모를 113px 넘쳐 지도가 전류·상태 밴드와
       스트립 위를 덮던 것
    ③ 전류 기본색 --c-cur 이 --bad 와 같은 #f85149 라 30A 정상 비행 내내
       빨간 막대가 켜져 있던 것 (색 예산 위반)

  ?demo=1 합성 피드를 iframe 으로 띄워 DOM 을 실측한다. FC 도 서버 데이터도
  필요 없다. 화면을 고친 뒤에는 이걸 먼저 돌려라.
-->
<style>
  body { background: #0d1117; color: #e6edf3; font: 13px ui-monospace, monospace; padding: 16px; }
  pre { line-height: 1.7; }
  .P { color: #3fb950; } .F { color: #f85149; font-weight: 700; }
  h1 { font-size: 15px; } iframe { position: absolute; left: -9999px; top: 0; }
  #sum { margin: 10px 0; font-size: 14px; font-weight: 700; }
</style>
<h1>SHADE01 라이브 HUD — 자체검사</h1>
<div id="sum">검사 중…</div>
<pre id="out"></pre>
<script>
const R = [];
function ok(n, c, d) { R.push([c, n, d || '']); draw(); }
function note(s) { R.push([null, s, '']); draw(); }
function draw() {
  document.getElementById('out').innerHTML = R.map(([c, n, d]) =>
    c === null ? `<span style="color:#6e7681">   ${n}</span>`
      : `<span class="${c ? 'P' : 'F'}">${c ? 'PASS' : 'FAIL'}</span>  ${n}` +
        (d ? `<span style="color:#6e7681">  — ${d}</span>` : '')).join('\n');
  const f = R.filter(r => r[0] === false).length, p = R.filter(r => r[0] === true).length;
  const s = document.getElementById('sum');
  s.textContent = `${p} PASS · ${f} FAIL`;
  s.style.color = f ? '#f85149' : '#3fb950';
}
function load(q, w, h) {
  return new Promise((res) => {
    const f = document.createElement('iframe');
    f.style.width = (w || 1100) + 'px'; f.style.height = (h || 845) + 'px'; f.style.border = '0';
    // notiles=1 — iframe 24개가 각자 외부 타일을 받으러 가면 검사가 끝나지
    // 않는다 (실측: 180초에도 "검사 중…"). 지도 자체는 그대로 뜨므로
    // 마커·궤적·레이아웃 검사에는 영향이 없다.
    f.src = '/?demo=1&notiles=1' + (q ? '&' + q : '');
    f.onload = () => setTimeout(() => res(f), 2600);
    document.body.appendChild(f);
  });
}
const num = (e, a) => parseFloat(e.getAttribute(a));
const MOT = ['LF', 'RF', 'LB', 'RB'];

(async () => {
  // ── 기하: viewBox 가 실측 픽셀과 1:1 ─────────────────────────────
  note('■ 기하 — 배율 왜곡·잘림');
  let f = await load('');
  let D = f.contentDocument, W = f.contentWindow, svg = D.getElementById('hud');
  let box = D.getElementById('hudBox').getBoundingClientRect(), vb = svg.viewBox.baseVal;
  ok('viewBox 가 실측 픽셀과 1:1', Math.abs(vb.width - box.width) <= 1 && Math.abs(vb.height - box.height) <= 1,
     `vb=${vb.width}x${vb.height} box=${box.width.toFixed(0)}x${box.height.toFixed(0)}`);
  ok('preserveAspectRatio 미사용 (비등방 왜곡 원천차단)', !svg.hasAttribute('preserveAspectRatio'));

  let strip = D.getElementById('strip').getBoundingClientRect();
  ok('숫자 스트립이 화면 안', strip.bottom <= W.innerHeight + 1,
     `bottom=${strip.bottom.toFixed(0)} vh=${W.innerHeight}`);
  const TW = Math.min(Math.max(vb.width * 0.082, 62), 92);
  const sBox = [...svg.querySelectorAll('rect')].filter(e => e.getAttribute('stroke') === 'var(--c-spd)');
  const aBox = [...svg.querySelectorAll('rect')].filter(e => e.getAttribute('stroke') === 'var(--c-alt)');
  ok('속도 판독박스가 테이프 폭 안', sBox.every(e => num(e, 'x') >= -.5 && num(e, 'x') + num(e, 'width') <= TW + .5),
     sBox.map(e => `x=${e.getAttribute('x')} w=${e.getAttribute('width')}`).join(' '));
  ok('고도 판독박스가 패널 안', aBox.every(e => num(e, 'x') + num(e, 'width') <= vb.width + .5),
     aBox.map(e => `x=${e.getAttribute('x')} w=${e.getAttribute('width')}`).join(' '));

  // ── 성능: 노드 생성 0 ────────────────────────────────────────────
  note('■ 성능 — build-once / mutate-only');
  const n1 = svg.querySelectorAll('*').length;
  const rotOf = () => [...svg.querySelectorAll('g')].find(g => /rotate/.test(g.getAttribute('transform') || '')).getAttribute('transform');
  const t1 = rotOf();
  await new Promise(r => setTimeout(r, 4000));
  ok('20폴 동안 SVG 노드 생성 0', n1 === svg.querySelectorAll('*').length, `${n1} → ${svg.querySelectorAll('*').length}`);
  ok('계기가 실제로 갱신된다', t1 !== rotOf(), `${t1} → ${rotOf()}`);
  ok('ResizeObserver 루프 경고 없음', !W.__roLoop);

  // ── 부호·스케일 ─────────────────────────────────────────────────
  note('■ 부호·스케일 — 계기가 거꾸로 돌면 조종자를 속인다');
  f = await load('roll=0&pitch=10'); D = f.contentDocument; svg = D.getElementById('hud');
  let dy = parseFloat([...svg.querySelectorAll('g')]
    .find(g => /^translate\(0,/.test(g.getAttribute('transform') || ''))
    .getAttribute('transform').match(/,(-?[\d.]+)\)/)[1]);
  ok('pitch +10 → 수평선이 아래로 (기수 들면 아래)', dy > 0, `translate y=${dy}`);
  ok('피치 6.0 px/도', Math.abs(dy - 60) < .6, `${dy} vs 60`);

  f = await load('roll=30&pitch=0'); D = f.contentDocument; svg = D.getElementById('hud');
  let rv = parseFloat([...svg.querySelectorAll('g')].find(g => /rotate/.test(g.getAttribute('transform') || ''))
    .getAttribute('transform').match(/rotate\((-?[\d.]+)\)/)[1]);
  ok('roll +30 → 배경 -30 회전', Math.abs(rv + 30) < .6, `rotate(${rv})`);

  // 고도 스케일은 지면선(alt=0)으로 잰다. 고도 50m 면 지면선이 판독 중심에서
  // 정확히 400px 아래(8px/m × 50)에 있어야 한다.
  // 예전에는 50m 펜스 천장선으로 쟀는데, FC 에서 펜스를 끄면서 그 선을 없앴다.
  f = await load('alt=50'); D = f.contentDocument; svg = D.getElementById('hud');
  let gnd = [...svg.querySelectorAll('line')].find(l => l.getAttribute('stroke') === 'var(--dim)' && l.getAttribute('stroke-width') === '2');
  let ty = parseFloat(gnd.closest('g[transform]').getAttribute('transform').match(/,(-?[\d.]+)\)/)[1]);
  let ab = [...svg.querySelectorAll('rect')].find(e => e.getAttribute('stroke') === 'var(--c-alt)');
  let bc = num(ab, 'y') + num(ab, 'height') / 2;
  ok('고도 50m 에서 지면선이 판독 중심 +400px (8px/m)',
     Math.abs((ty + num(gnd, 'y1')) - (bc + 400)) < 1.5,
     `gnd=${(ty + num(gnd, 'y1')).toFixed(1)} 기대=${(bc + 400).toFixed(1)}`);

  // 🔴 지오펜스는 FC 에서 껐다 (GF_MAX_VER_DIST=0). 계기가 없는 제한선을
  //    그리면 거짓말이다 — 누가 되살리면 여기서 잡힌다.
  ok('고도 테이프에 펜스 천장선 없음',
     ![...svg.querySelectorAll('line')].some(l => l.getAttribute('stroke') === 'var(--bad)' && l.getAttribute('stroke-width') === '2'));

  // ── 고장난 에어스피드 격리 ───────────────────────────────────────
  note('■ 고장 센서 격리 — 대기속도는 계기가 아니라 정비 항목이다');
  f = await load(''); D = f.contentDocument; W = f.contentWindow; svg = D.getElementById('hud');
  // 스트립을 한 줄로 줄이면서 진단 칸을 뺐다 (2026-09-05). 이제 확인할 것은
  // '어디에도 안 나온다' 이다 — 고장 센서를 계기로 쓰지 않는 것이 핵심이다.
  ok('대기속도가 스트립에 없다', !D.getElementById('st-air'),
     D.getElementById('st-air') ? '아직 있다' : '없음');
  // 테이프 머리말은 뺐다 (2026-09-05). 그래도 지켜야 할 것은 그대로다:
  // 좌측 테이프에 **피토관 값이 오면 안 된다**. 고장 센서를 계기로 쓰는 순간
  // 조종자가 그걸 읽고 판단한다. 값이 GS(수평속도)와 같은지로 확인한다.
  const spdShown = parseFloat((D.getElementById('st-spd') || {}).textContent);
  const tapeVal = [...svg.querySelectorAll('text')]
    .map(t => parseFloat(t.textContent))
    .filter(v => isFinite(v));
  ok('좌측 테이프가 대지속도다 (피토관 아님)',
     isFinite(spdShown) && tapeVal.includes(spdShown),
     `스트립 속도=${spdShown} 테이프에 그 값이 있나`);

  // ── 색 예산 ─────────────────────────────────────────────────────
  note('■ 색 예산 — 색이 보이는 것 자체가 신호다');
  f = await load('cur=30&volt=24&roll=0&pitch=0'); D = f.contentDocument; W = f.contentWindow;
  svg = D.getElementById('hud');
  const hot = [];
  for (const e of svg.querySelectorAll('*')) {
    if (e.closest('.off')) continue;                       // 조상이 꺼져 있으면 안 보인다
    const t = (e.textContent || '').trim();
    if (e.tagName === 'text' && !t) continue;              // 빈 글자는 픽셀이 없다
    // --c-cur 은 #f85149 로 --bad 와 같은 색이다. 이름이 다르다고 봐주면 안 된다.
    if (!/--bad|--warn|--c-cur/.test((e.getAttribute('fill') || '') + (e.getAttribute('stroke') || ''))) continue;
    if (/66\.8|^45$/.test(t)) continue;                    // 정적 기준 눈금은 경고가 아니다
    if (e.tagName === 'line' || (e.tagName === 'rect' && num(e, 'opacity') <= .12)) continue;
    hot.push(e.tagName + ':' + (t || e.getAttribute('fill')));
  }
  ok('정상 상태(30A·24V)에 경고색 0건', hot.length === 0, hot.join(', ') || 'clean');
  // 전류는 이제 SVG 막대가 아니라 스트립 칸이다 (2026-09-05).
  ok('전류 30A 칸이 무채색', D.getElementById('sc-cur').className === 'sc',
     D.getElementById('sc-cur').className);
  f = await load('cur=61'); D = f.contentDocument;
  ok('전류 61A → .bad', /\bbad\b/.test(D.getElementById('sc-cur').className),
     D.getElementById('sc-cur').className + ' 값=' + D.getElementById('st-cur').textContent);
  f = await load('cur=50'); D = f.contentDocument;
  ok('전류 50A → .warn', /\bwarn\b/.test(D.getElementById('sc-cur').className),
     D.getElementById('sc-cur').className);

  // ── 비상정지 ────────────────────────────────────────────────────
  note('■ 비상정지 — 모터가 끊긴 것보다 급한 상태는 없다');
  f = await load('sys=8'); D = f.contentDocument; svg = D.getElementById('hud');
  {
    const kt = svg.querySelector('.killTxt');
    const kg = kt && kt.parentNode;
    ok('KILL 이면 EMERGENCY STOP 이 뜬다',
       !!kt && kt.textContent === 'EMERGENCY STOP' && !/\boff\b/.test(kg.getAttribute('class') || ''),
       kt ? `"${kt.textContent}" class="${kg.getAttribute('class')}"` : '없음');
    ok('KILL 이면 판이 빨간 테두리', (kg.querySelector('rect') || {}).getAttribute &&
       kg.querySelector('rect').getAttribute('stroke') === 'var(--bad)');
    ok('KILL 이면 점멸한다', /\bblink\b/.test(kg.getAttribute('class') || ''),
       kg.getAttribute('class'));
    // 모터가 끊긴 상태에서 ARMED 와 비행모드를 같이 보여주면 무엇이 참인지
    // 읽는 사람이 재야 한다. 자리를 내주는 것이 설계다.
    const armEl = svg.querySelector('.armTxt'), modeEl = svg.querySelector('.modeTxt');
    ok('KILL 이면 ARM 표시가 숨는다', /\boff\b/.test(armEl.getAttribute('class') || ''),
       armEl.getAttribute('class'));
    ok('KILL 이면 모드 표시가 숨는다', /\boff\b/.test(modeEl.getAttribute('class') || ''),
       modeEl.getAttribute('class'));
    // HUD 밖으로 나가면 통째로 안 보인다 — vtol 경고가 실제로 겪은 실패다.
    const hb = D.getElementById('hudBox').getBoundingClientRect();
    const kb = kt.getBoundingClientRect();
    ok('KILL 글자가 HUD 안', kb.top >= hb.top - 1 && kb.bottom <= hb.bottom + 1,
       `kill=${kb.top.toFixed(0)}~${kb.bottom.toFixed(0)} hud=${hb.top.toFixed(0)}~${hb.bottom.toFixed(0)}`);
  }
  f = await load(''); D = f.contentDocument; svg = D.getElementById('hud');
  {
    const kg = svg.querySelector('.killTxt').parentNode;
    ok('평상시엔 EMERGENCY STOP 이 안 뜬다', /\boff\b/.test(kg.getAttribute('class') || ''),
       kg.getAttribute('class'));
    ok('평상시엔 ARM 표시가 보인다',
       !/\boff\b/.test(svg.querySelector('.armTxt').getAttribute('class') || ''));
  }

  // ── 조건부 표시 ─────────────────────────────────────────────────
  note('■ 조건부 표시 — 멈춘 숫자는 없는 숫자보다 나쁘다');
  f = await load(''); D = f.contentDocument; W = f.contentWindow;
  // WP 칸은 통합하면서 뺐다. 대신 남긴 6칸이 전부 있는지 본다 —
  // 하나라도 없으면 render 가 조용히 죽은 것이다.
  // 모터는 칸 넷이 아니라 **기체 그림 하나 + 요약 둘**이다 (2026-09-09).
  const want = ['sc-spd', 'sc-alt', 'sc-batt', 'sc-cur', 'sc-sats', 'sc-eph',
                'sc-frame', 'sc-mspread', 'sc-mavg'];
  const missing = want.filter((id) => !D.getElementById(id));
  ok('계기판 9칸이 전부 있다', missing.length === 0, missing.join(',') || 'ok');
  // 로터 4개가 실제 기체 배치와 같은 자리인지 — 좌전이 좌상단이어야 한다.
  // getBoundingClientRect 는 SVG 요소에도 화면 좌표로 답한다.
  const cellBox = (id) => D.getElementById(id).getBoundingClientRect();
  ok('로터 좌전이 우전 왼쪽', cellBox('rot-LF').left < cellBox('rot-RF').left);
  ok('로터 좌후가 좌전 아래', cellBox('rot-LB').top > cellBox('rot-LF').top);
  ok('기체 그림이 보인다', cellBox('mframe').width > 40 && cellBox('mframe').height > 40,
     `${cellBox('mframe').width.toFixed(0)}x${cellBox('mframe').height.toFixed(0)}`);
  // 부하가 큰 모터가 실제로 더 큰 원이어야 한다 — 이 계기의 존재 이유다.
  // 데모는 LF 가 가장 크고 RB 가 가장 작다 (spread 기본 4%p).
  const rr = (id) => parseFloat(D.getElementById(id).getAttribute('r'));
  ok('부하 큰 모터가 더 큰 원', rr('rot-LF') > rr('rot-RB'),
     `LF r=${rr('rot-LF')} > RB r=${rr('rot-RB')}`);
  ok('모터 값이 원 안에 찍힌다',
     (D.getElementById('mv-LF').textContent || '').trim() !== '—',
     D.getElementById('mv-LF').textContent);
  const vals = ['st-cur', 'st-batt', 'st-spd', 'st-alt', 'st-sats', 'st-eph']
    .map((id) => (D.getElementById(id) || {}).textContent);
  ok('스트립 값이 채워진다', vals.every((v) => v && v !== ''), vals.join(' / '));
  // 편차가 평소 범위면 색이 없어야 한다 — 평소에 색이 보이면 색이 신호가 아니게 된다.
  ok('평소 편차엔 색이 없다',
     !D.getElementById('sc-mspread').classList.contains('warn') &&
     !D.getElementById('sc-mspread').classList.contains('bad'),
     D.getElementById('st-mspread').textContent + '%p');

  // ── 모터 편차 경고 ──────────────────────────────────────────────
  // 이 계기의 존재 이유가 "한쪽만 무리하는 것을 잡는다" 이므로, 그 경로가
  // 실제로 도는지 본다. 멀쩡한 실기에서는 한 번도 안 돌아 보는 코드다.
  note('■ 모터 편차 — 한쪽만 무리하는 것을 잡는 경로');
  f = await load('spread=26'); D = f.contentDocument;
  const spCell = D.getElementById('sc-mspread');
  ok('큰 편차는 bad', spCell.classList.contains('bad'),
     D.getElementById('st-mspread').textContent + '%p');
  // 🔴 편차는 **숫자 칸만** 칠한다. 로터 색은 그 모터 자신의 부하가 정한다.
  //    편차가 26%p 로 크더라도 넷 다 70% 미만이면 로터에는 색이 없어야 한다.
  //    (위 spread=26 은 평균 62 라 최대가 75% → 그건 부하 때문에 칠해지는 게
  //     맞다. 그래서 평균을 낮춰 부하 요인을 걷어내고 편차만 남긴다.)
  f = await load('spread=26&mavg=50'); D = f.contentDocument;
  ok('큰 편차라도 부하가 낮으면 로터는 무채색',
     !MOT.some((k) => {
       const c = D.getElementById('rot-' + k).classList;
       return c.contains('warn') || c.contains('bad');
     }),
     MOT.map((k) => D.getElementById('mv-' + k).textContent).join(','));
  ok('그때도 편차 숫자는 bad',
     D.getElementById('sc-mspread').classList.contains('bad'),
     D.getElementById('st-mspread').textContent + '%p');

  f = await load('spread=14'); D = f.contentDocument;
  ok('중간 편차는 warn', D.getElementById('sc-mspread').classList.contains('warn'),
     D.getElementById('st-mspread').textContent + '%p');

  // ── 모터 개별 부하 색 — 70%↑ 노랑 / 80%↑ 빨강 ────────────────────
  note('■ 모터 부하 색 — 그 모터 자신의 값이 색을 정한다');
  // 평균 74%·편차 0 → 넷 다 warn 이고 bad 는 없다.
  f = await load('mavg=74&spread=0'); D = f.contentDocument;
  const cls = (k) => D.getElementById('rot-' + k).classList;
  ok('74% 는 넷 다 노랑',
     MOT.every((k) => cls(k).contains('warn')) && !MOT.some((k) => cls(k).contains('bad')),
     MOT.map((k) => D.getElementById('mv-' + k).textContent).join(','));
  // 평균 84% → 넷 다 bad.
  f = await load('mavg=84&spread=0'); D = f.contentDocument;
  const cls2 = (k) => D.getElementById('rot-' + k).classList;
  ok('84% 는 넷 다 빨강', MOT.every((k) => cls2(k).contains('bad')),
     MOT.map((k) => D.getElementById('mv-' + k).textContent).join(','));
  // 문턱을 사이에 두고 갈린다 — 한 화면에 두 색이 같이 있는 것이 정상이다.
  // 평균 75%·편차 14%p → 최대 82%(빨강) 최소 68%(무채색) 이 섞인다.
  f = await load('mavg=75&spread=14'); D = f.contentDocument;
  const cls3 = (k) => D.getElementById('rot-' + k).classList;
  const anyBad = MOT.some((k) => cls3(k).contains('bad'));
  const anyPlain = MOT.some((k) => !cls3(k).contains('bad') && !cls3(k).contains('warn'));
  ok('문턱을 사이에 두면 색이 섞인다', anyBad && anyPlain,
     MOT.map((k) => D.getElementById('mv-' + k).textContent
       + (cls3(k).contains('bad') ? '!' : cls3(k).contains('warn') ? '?' : '')).join(' '));
  // 부하가 큰 모터가 실제로 더 큰 원이어야 한다 — 크기 매핑이 색과 별개로 산다.
  const rr3 = (k) => parseFloat(D.getElementById('rot-' + k).getAttribute('r'));
  ok('색이 붙어도 크기 순서는 유지', rr3('LF') > rr3('RB'),
     `LF r=${rr3('LF')} > RB r=${rr3('RB')}`);

  // 평균이 높으면 추력 여유가 없다는 뜻 — 그 경로도 확인한다.
  f = await load('mavg=93&spread=2'); D = f.contentDocument;
  ok('평균 90% 초과는 bad', D.getElementById('sc-mavg').classList.contains('bad'),
     D.getElementById('st-mavg').textContent + '%');

  // ── 지도 ────────────────────────────────────────────────────────
  // HUD 는 자세를 말하지만 어디 있는지를 말하지 않는다. 그 칸이 실제로
  // 그려지는지, 좌우 비율이 1:3 인지, GPS 가 없을 때 이유를 말하는지 본다.
  note('■ 지도 — 위치 감이 이 칸의 존재 이유다');
  f = await load(''); D = f.contentDocument; W = f.contentWindow;
  const mapPane = D.getElementById('mapPane'), hudBox = D.getElementById('hudBox');
  ok('지도 칸이 있다', !!mapPane);
  if (mapPane && hudBox) {
    const mb = mapPane.getBoundingClientRect(), hb = hudBox.getBoundingClientRect();
    ok('지도가 HUD 왼쪽', mb.left < hb.left, `map=${mb.left.toFixed(0)} hud=${hb.left.toFixed(0)}`);
    // 1:3 — HUD 가 지도의 두 배는 넘어야 "3" 이라 부를 수 있다.
    ok('HUD 가 지도보다 넓다 (1:3)', hb.width > mb.width * 2,
       `map=${mb.width.toFixed(0)} hud=${hb.width.toFixed(0)}`);
    ok('지도가 눌리지 않았다', mb.width > 100 && mb.height > 100,
       `${mb.width.toFixed(0)}x${mb.height.toFixed(0)}`);
    // 🔴 지도는 **HUD 줄 안에서만** 폭을 나눈다. 아래 계기판은 그 분할과
    //    무관하게 hudPane 폭을 그대로 써야 한다 (2026-09-10 정정 — 처음에
    //    main 칸을 하나 더 만들었더니 계기판까지 밀려났다).
    const strip = D.getElementById('strip').getBoundingClientRect();
    ok('계기판이 지도에 안 밀린다', strip.left <= mb.left + 1,
       `strip.left=${strip.left.toFixed(0)} map.left=${mb.left.toFixed(0)}`);
    ok('계기판이 지도+HUD 폭을 다 쓴다', strip.width >= (mb.width + hb.width) - 4,
       `strip=${strip.width.toFixed(0)} map+hud=${(mb.width + hb.width).toFixed(0)}`);
  }
  // 🔴 GPS 를 받으면 그 자리가 중심이고, 배율은 50m 급이다 (실내·실외 무관).
  const LM = W.__lmap;
  ok('지도 핸들이 있다', !!LM);
  if (LM) {
    ok('줌이 50m 급 (z19)', LM.getZoom() === 19, 'z' + LM.getZoom());
    const c = LM.getCenter(), dd = f.contentWindow;
    // 데모 좌표(35.181, 128.554) 근처에 중심이 잡혔는가 — GPS 를 따라간다는 뜻.
    ok('GPS 좌표가 지도 중심', Math.abs(c.lat - 35.181) < 0.01 && Math.abs(c.lng - 128.554) < 0.01,
       `${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}`);
    const b = LM.getBounds();
    const wm = LM.distance(b.getNorthWest(), b.getNorthEast());
    ok('화면 가로가 100m 이내', wm < 100, wm.toFixed(0) + 'm');
  }
  // Leaflet 이 실제로 타일을 붙였는가 — 스크립트가 안 실려도 칸은 남으므로
  // 칸 존재만으로는 확인이 안 된다.
  const panes = D.querySelectorAll('#lmap .leaflet-tile-pane');
  ok('Leaflet 이 붙었다', panes.length > 0, `tile-pane ${panes.length}개`);
  // 데모는 좌표를 주므로 기체 아이콘과 궤적이 있어야 한다.
  ok('기체 아이콘이 그려진다',
     D.querySelectorAll('#lmap .leaflet-marker-icon').length > 0,
     `marker ${D.querySelectorAll('#lmap .leaflet-marker-icon').length}개`);
  ok('궤적 선이 그려진다',
     D.querySelectorAll('#lmap path.leaflet-interactive, #lmap path').length > 0);
  // GPS 가 없으면 왜 비었는지 말해야 한다 — 회색판만 남으면 고장으로 읽힌다.
  ok('GPS 있으면 안내가 숨는다', D.getElementById('mapEmpty').hidden === true);

  // ── 좁은 화면 ───────────────────────────────────────────────────
  note('■ 좁은 화면 — 계기가 사라지는 건 계기가 틀린 것 다음으로 나쁘다');
  f = await load('', 520, 1000); D = f.contentDocument; svg = D.getElementById('hud');
  const pane = D.getElementById('hudPane').getBoundingClientRect();
  box = D.getElementById('hudBox').getBoundingClientRect();
  strip = D.getElementById('strip').getBoundingClientRect();
  // 지도를 뺀 뒤로 우측은 chartPane 이다 (2026-09-05). mapPane 을 계속 읽다가
  // null.getBoundingClientRect() 로 자체검사가 통째로 죽어 있었다.
  const mp = D.getElementById('chartPane').getBoundingClientRect();
  vb = svg.viewBox.baseVal;
  ok('HUD 가 제 부모 안에 담긴다', box.bottom <= pane.bottom + 1,
     `hudBox.bottom=${box.bottom.toFixed(0)} pane.bottom=${pane.bottom.toFixed(0)}`);
  ok('차트 패널이 스트립을 안 덮는다', mp.top >= strip.bottom - 1,
     `chart.top=${mp.top.toFixed(0)} strip.bottom=${strip.bottom.toFixed(0)}`);
  // 전류·상태 밴드는 HUD 밖(HTML 스트립)으로 나갔다 (2026-09-05).
  // 좁은 화면에서 스트립이 안 잘리는지가 그 자리를 대신하는 검사다.
  const st = D.getElementById('strip').getBoundingClientRect();
  ok('좁아도 스트립이 화면 안', st.bottom <= f.contentWindow.innerHeight + 1,
     `strip.bottom=${st.bottom.toFixed(0)} win=${f.contentWindow.innerHeight}`);
  const scs = [...D.querySelectorAll('#strip .sc')];
  ok('좁아도 스트립 칸이 안 사라진다', scs.length >= 6, `칸 ${scs.length}개`);

  // ── 기록 배지 ────────────────────────────────────────────────────
  // 야외 게이트를 넣은 뒤로 "안 찍히는 것"도 정상 동작이 됐다. 그 사실이
  // 화면에 없으면 조종자는 착륙한 뒤에야 파일이 없는 것을 안다.
  note('■ 기록 상태 — 왜 안 찍히나가 화면에 있나');
  f = await load('rec=on');
  D = f.contentDocument;
  let rc = D.getElementById('recSt');
  ok('적는 중이면 REC 가 뜬다', !rc.hidden && /^REC /.test(rc.textContent),
     `"${rc.textContent}" hidden=${rc.hidden}`);
  ok('어느 경로로 적는지 같이 말한다', /ELRS/.test(rc.textContent) && /FC/.test(rc.textContent),
     rc.textContent);

  f = await load('rec=wait');
  rc = f.contentDocument.getElementById('recSt');
  ok('GPS 대기는 실내대기로 뜬다', !rc.hidden && rc.textContent.includes('실내대기'),
     `"${rc.textContent}" hidden=${rc.hidden}`);
  ok('실내대기 이유가 title 에 있다',
     /GPS|fix|위성/.test(rc.title), rc.title.slice(0, 60));

  f = await load('rec=off');
  rc = f.contentDocument.getElementById('recSt');
  ok('안 적을 때는 칸이 숨는다', rc.hidden, `hidden=${rc.hidden} "${rc.textContent}"`);

  // ── 통합 재생 목록 ───────────────────────────────────────────────
  // 버튼은 하나여야 한다. 두 개였을 때 사용자가 "로그 재생" 과 "재생" 의
  // 차이를 물어야 했다 — 재생 방식의 차이는 사정이지 선택지가 아니다.
  note('■ 통합 재생 목록');
  f = await load('');
  D = f.contentDocument; W = f.contentWindow;
  ok('재생 버튼이 하나다', !!D.getElementById('pbOpen') && !D.getElementById('recBtn'),
     `pbOpen=${!!D.getElementById('pbOpen')} recBtn=${!!D.getElementById('recBtn')}`);

  // 목록은 서버를 때린다. 실기 데이터에 기대면 검사가 그날그날 달라지므로
  // fetch 를 갈아끼워 **합성 응답**을 먹인다 — 한 비행 두 경로 + ulg 하나.
  const real = W.fetch;
  W.fetch = (u, o) => {
    if (String(u).startsWith('/api/recordings')) {
      return Promise.resolve({ ok: true, json: () => Promise.resolve({
        items: [{ when: 1, label: '2026-09-05 09:24', size: 3e6,
                  kinds: ['ELRS', 'FC'],
                  files: [{ name: 'a_ELRS.tlog', kind: 'ELRS', size: 1e6 },
                          { name: 'a_FC.tlog', kind: 'FC', size: 2e6 }] },
                { when: 2, label: '2026-09-05 08:10', size: 1e6, kinds: ['FC'],
                  files: [{ name: 'b_FC.tlog', kind: 'FC', size: 1e6 }] }] }) });
    }
    if (String(u).startsWith('/api/logs')) {
      return Promise.resolve({ ok: true, json: () => Promise.resolve({
        source: 'labserver', error: null,
        logs: [
          { name: '2026-08-25_09_09_49.ulg', disp: 'log_98_2026-8-25-18-11-28.ulg',
            num: 98, exact: false, size: 5.1e6, local: true, recovered: false,
            when: '2026-08-25 18:11' },
          // 복구본 — 원본과 **같은 disp** 를 받는다.
          { name: 'RECOVERED_09_09_49.ulg', disp: 'log_98_2026-8-25-18-11-28.ulg',
            num: 98, exact: false, size: 5.09e6, local: true, recovered: true,
            when: '2026-08-25 18:11' },
        ] }) });
    }
    return real(u, o);
  };
  D.getElementById('pbOpen').click();
  await new Promise((z) => setTimeout(z, 400));

  const rows = [...D.querySelectorAll('#pbList .row')];
  ok('두 종류가 한 목록에 선다', rows.length === 4, `줄 ${rows.length}개 (기대 4)`);

  // 🔴 FC 로그에는 머리말이 없어야 한다. 이름이 log_<번호>_<시각> 이라
  //    무엇인지 이름만 봐도 안다 (사용자 지시 2026-09-06).
  const heads = [...D.querySelectorAll('#pbList .gh')].map((e) => e.textContent);
  ok('머리말은 실시간 기록 하나뿐이다',
     heads.length === 1 && /실시간/.test(heads[0]), heads.join(' | ') || '(없음)');

  // 배지가 **맨 왼쪽**이어야 한다 — 종류가 이름보다 먼저 보인다.
  const first = rows[0].firstElementChild;
  ok('배지가 줄 맨 왼쪽이다', first && first.classList.contains('kinds'),
     first ? first.className : '(빈 줄)');

  // 같은 비행의 두 경로가 한 줄 안에 배지 둘로 붙어야 한다.
  const b0 = [...rows[0].querySelectorAll('.kind')].map((e) => e.textContent);
  ok('같은 비행의 두 링크가 한 줄에 붙는다',
     b0.length === 2 && b0.includes('ELRS') && b0.includes('FC'), b0.join('+'));

  // ulg 줄: 이름이 통합 형식 하나이고, 시각이 따로 또 안 적혀야 한다.
  const ulgRows = rows.filter((r) => r.querySelector('.k-ULG,.k-ULGX'));
  ok('ulg 가 두 줄이다 (정상 + 복구본)', ulgRows.length === 2, `${ulgRows.length}줄`);
  const nm = ulgRows[0].querySelector('.nm').textContent;
  ok('제목이 log_<번호>_<시각>.ulg 통합 형식이다',
     /^log_\d+_\d{4}-\d{1,2}-\d{1,2}-\d{2}-\d{2}-\d{2}\.ulg$/.test(nm), nm);
  ok('제목 말고 시각을 또 적지 않는다',
     !/\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(ulgRows[0].textContent),
     ulgRows[0].textContent.trim());

  // 🔴 복구본은 **원본과 같은 제목**을 쓰고 배지로만 갈린다 (사용자 지시).
  const recRow = ulgRows.find((r) => r.querySelector('.k-REC2'));
  ok('복구본이 배지로 표시된다', !!recRow,
     recRow ? recRow.querySelector('.nm').textContent : '(없음)');
  ok('복구본 제목이 원본과 같다',
     !!recRow && recRow.querySelector('.nm').textContent === nm,
     recRow ? recRow.querySelector('.nm').textContent + ' vs ' + nm : '-');

  // 추론한 번호는 형태로도 갈려야 한다 (색만으로는 색맹에게 안 보인다).
  const cs = (e) => W.getComputedStyle(e);
  const bx = D.querySelector('#pbList .k-ULGX');
  ok('추론 번호 배지는 점선이다', !!bx && cs(bx).borderStyle === 'dashed',
     bx ? cs(bx).borderStyle : '(없음)');
  const be = rows[0].querySelector('.k-ELRS'), bf = rows[0].querySelector('.k-FC');
  ok('두 경로 배지가 다른 색이다', !!be && !!bf && cs(be).color !== cs(bf).color,
     `${be ? cs(be).color : '-'} vs ${bf ? cs(bf).color : '-'}`);

  // ── 버튼 자리 ────────────────────────────────────────────────────
  // 재생 버튼은 접기 버튼 **바로 왼쪽**이다 (사용자 지시 2026-09-06).
  const po = D.getElementById('pbOpen'), mt = D.getElementById('msgToggle');
  ok('재생 버튼이 접기 버튼 바로 왼쪽이다', po && mt && po.nextElementSibling === mt,
     po && mt ? `pbOpen 다음=${po.nextElementSibling && po.nextElementSibling.id}` : '-');

  // 피커 제목
  const hd = D.querySelector('#pbPick .hd b');
  ok('피커 제목이 「비행 로그 재생」이다', hd && hd.textContent === '비행 로그 재생',
     hd ? hd.textContent : '(없음)');

  note('완료. FAIL 이 0 이어야 배포한다.');
})().catch((e) => { ok('자체검사 자체가 죽었다', false, e.message); });
</script>
