<!doctype html>
<meta charset="utf-8">
<title>SHADE01 라이브</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/live.css">

<main>
  <!-- 좌: HUD. DOM 순서상 먼저다 — 좁은 화면에서 그대로 위로 간다. -->
  <section id="hudPane">
    <div id="hudBox">
      <!-- viewBox 는 layout() 이 실측 픽셀로 넣는다. 여기에 미리 쓰지 마라 —
           고정 viewBox 를 두면 배율이 1:1 이 아니게 되어 45° 뱅크가 30° 로 보인다. -->
      <svg id="hud" aria-label="HUD"></svg>
    </div>

    <!-- HUD 아래 숫자 스트립. 계기가 그림으로 말하지 못하는 값만 여기 온다. -->
    <div id="strip">
      <div class="sc" id="sc-volt"><span class="k">전압</span><b id="st-volt">—</b><i id="st-cell">V</i></div>
      <div class="sc" id="sc-mah"><span class="k">소모</span><b id="st-mah">—</b><i id="st-pct">mAh</i></div>
      <div class="sc"><span class="k">스로틀</span><b id="st-thr">—</b><i>%</i></div>
      <div class="sc"><span class="k">상승률</span><b id="st-climb">—</b><i>m/s</i></div>
      <div class="sc" id="sc-home"><span class="k">홈거리</span><b id="st-home">—</b><i>/ 150 m 설정값</i></div>
      <!-- AUTO.* 가 아니면 통째로 사라진다. 멈춘 wp_dist 는 없는 숫자보다 나쁘다. -->
      <div class="sc" id="sc-wp" hidden><span class="k">WP</span><b id="st-wp">—</b><i id="st-xt"></i></div>
      <!-- 진단 칸은 색이 절대 안 붙는다 — 비행 판단값이 아니라 정비 항목이다. -->
      <div class="sc diag"><span class="k">진단</span><b id="st-air">—</b><i>대기속도 영점불량</i><b id="st-load">—</b><i>CPU%</i></div>
    </div>
  </section>

  <!-- 우: 흘러가는 차트 + FC 메시지 서랍.
       로그 뷰어(log.html)와 같은 배치·같은 chart.js 를 쓴다 — 지난 비행과
       지금 비행을 같은 그림으로 읽어야 눈이 안 흔들린다. -->
  <section id="chartPane">
    <div id="charts"></div>
    <!-- 어느 단을 볼지. 켠 단이 곧 목차다 (로그 뷰어의 좌측 목차와 같은 구실). -->
    <div id="toc" class="overlay"></div>
    <!-- 하단 바. 화면 위를 한 줄도 안 쓰려고 여기 다 모았다.
         링크 상태는 글자가 아니라 점 하나다 — 초록/노랑/빨강. -->
    <div class="msgs">
      <div class="hd">
        <span id="dot" class="dot" title="링크 상태">●</span>
        <span>FC 메시지</span><span class="cnt" id="msgCnt"></span>
        <span class="grow"></span>
        <span class="stats" id="stats"></span>
        <select id="win" title="차트가 보여주는 시간 창">
          <option value="60">1분</option>
          <option value="180" selected>3분</option>
          <option value="600">10분</option>
          <option value="0">전체</option>
        </select>
        <button id="msgToggle" title="서랍 접기/펴기">접기</button>
      </div>
      <div id="msgs"></div>
    </div>
  </section>
</main>

<script src="/chart.js"></script>
<script src="/live.js"></script>
