<!doctype html>
<meta charset="utf-8">
<title>SHADE01 라이브</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/live.css">

<header>
  <h1>SHADE01 <span class="muted" style="font-weight:400">라이브</span></h1>
  <span id="link" class="pill pill-off">링크 없음</span>
  <span id="armed" class="pill pill-off">DISARMED</span>
  <span id="mode" class="pill">—</span>
  <span id="vtol" class="pill" hidden></span>
  <span class="grow"></span>
  <span class="muted" id="stats" style="font-size:12px"></span>
  <button id="followBtn" class="on" title="기체를 화면 가운데 유지">추적</button>
  <button id="clearBtn" title="항적·메시지 지우기">항적 지우기</button>
  <a class="btn" href="http://localhost:4399/" target="_blank" title="지난 비행 로그 뷰어">로그</a>
</header>

<div id="banner" hidden></div>

<main>
  <section id="mapPane">
    <div id="map"></div>
    <div id="mapInfo" class="overlay">
      <div><span class="k">위도</span><span class="v" id="o-lat">—</span></div>
      <div><span class="k">경도</span><span class="v" id="o-lon">—</span></div>
      <div><span class="k">홈거리</span><span class="v" id="o-home">—</span></div>
      <div><span class="k">항적</span><span class="v" id="o-trk">—</span></div>
    </div>
  </section>

  <section id="dataPane">
    <!-- 큰 숫자 4개. 비행 중 곁눈질로 읽는 값이다. -->
    <div class="big">
      <div class="cell">
        <div class="lbl">고도 <span class="unit">m AGL</span></div>
        <div class="num" id="b-alt">—</div>
      </div>
      <div class="cell">
        <div class="lbl">대지속도 <span class="unit">m/s</span></div>
        <div class="num" id="b-spd">—</div>
      </div>
      <div class="cell">
        <div class="lbl">전압 <span class="unit">V</span></div>
        <div class="num" id="b-volt">—</div>
      </div>
      <div class="cell">
        <div class="lbl">전류 <span class="unit">A</span></div>
        <div class="num" id="b-cur">—</div>
      </div>
    </div>

    <!-- 자세 — 인공수평의. 지도만으로는 기울기를 못 본다. -->
    <div class="row2">
      <div class="panel attitude">
        <svg id="ahi" viewBox="0 0 200 200" aria-label="인공수평의"></svg>
      </div>
      <div class="panel gauges">
        <div class="g"><span class="k">ROLL</span><b id="g-roll">—</b><span class="u">°</span></div>
        <div class="g"><span class="k">PITCH</span><b id="g-pitch">—</b><span class="u">°</span></div>
        <div class="g"><span class="k">HDG</span><b id="g-hdg">—</b><span class="u">°</span></div>
        <div class="g"><span class="k">상승률</span><b id="g-climb">—</b><span class="u">m/s</span></div>
        <div class="g"><span class="k">스로틀</span><b id="g-thr">—</b><span class="u">%</span></div>
        <div class="g"><span class="k">대기속도</span><b id="g-air">—</b><span class="u">m/s</span></div>
      </div>
    </div>

    <!-- 상태 배지 — 초록/노랑/빨강만 보면 된다 -->
    <div class="status">
      <div class="s" id="s-gps"><span class="k">GPS</span><b>—</b></div>
      <div class="s" id="s-ekf"><span class="k">EKF</span><b>—</b></div>
      <div class="s" id="s-vibe"><span class="k">진동</span><b>—</b></div>
      <div class="s" id="s-batt"><span class="k">배터리</span><b>—</b></div>
      <div class="s" id="s-rc"><span class="k">RC</span><b>—</b></div>
      <div class="s" id="s-mah"><span class="k">소모</span><b>—</b></div>
    </div>

    <!-- 최근 60초 추이. 로그 뷰어의 차트와 같은 관용구(SVG 직접 그리기). -->
    <div class="panel charts">
      <div class="chartrow"><span class="clbl">고도</span><svg id="c-alt" viewBox="0 0 300 44"></svg></div>
      <div class="chartrow"><span class="clbl">속도</span><svg id="c-spd" viewBox="0 0 300 44"></svg></div>
      <div class="chartrow"><span class="clbl">전류</span><svg id="c-cur" viewBox="0 0 300 44"></svg></div>
    </div>

    <div class="panel msgs">
      <div id="msgs"></div>
    </div>
  </section>
</main>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/live.js"></script>
