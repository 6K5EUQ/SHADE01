<!doctype html>
<meta charset="utf-8">
<title>SHADE01 라이브</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/live.css">

<main>
  <!-- 좌: HUD. DOM 순서상 먼저다 — 좁은 화면에서 그대로 위로 간다. -->
  <section id="hudPane">
    <div id="hudBox">
      <!-- viewBox 는 layout() 이 실측 픽셀로 넣는다. 여기에 미리 쓰지 마라 —
           고정 viewBox 를 두면 배율이 1:1 이 아니게 되어 45° 뱅크가 30° 로 보인다. -->
      <svg id="hud" aria-label="HUD"></svg>
    </div>

    <!-- HUD 아래 계기판. 우측 2번째 차트 아랫선까지 올라온다 (2026-09-05).
         숫자만 보고 판단하는 자리라 크게 — 배치는 조종자가 부르는 순서다.
           속도  고도  배터리
           전류  위성
           모터 좌전 / 우전
           모터 좌후 / 우후
         모터는 **기체에 붙은 자리 그대로** 2×2 로 놓는다. 화면 왼쪽 위 칸이
         실제 좌전 모터다 — 어느 모터가 튀는지 눈이 바로 짚는다. -->
    <div id="strip">
      <div class="sc" id="sc-spd"><span class="k">속도</span><b id="st-spd">—</b><i>m/s</i></div>
      <div class="sc" id="sc-alt"><span class="k">고도</span><b id="st-alt">—</b><i>m</i></div>
      <div class="sc" id="sc-batt"><span class="k">배터리</span><b id="st-batt">—</b><i>%</i></div>

      <div class="sc" id="sc-cur"><span class="k">전류</span><b id="st-cur">—</b><i>A</i></div>
      <div class="sc" id="sc-sats"><span class="k">위성</span><b id="st-sats">—</b><i>기</i></div>
      <!-- eph — 위성 수가 많아도 이 값이 부풀면 위치가 흔들린다.
           실측 평소 0.15~0.23m 라 1m 를 넘는 것 자체가 신호다. -->
      <div class="sc" id="sc-eph"><span class="k">위치 오차</span><b id="st-eph">—</b><i>m</i></div>

      <div class="sc mot" id="sc-mLF"><span class="k">모터 좌전</span><b id="st-mLF">—</b><i>%</i></div>
      <div class="sc mot" id="sc-mRF"><span class="k">모터 우전</span><b id="st-mRF">—</b><i>%</i></div>

      <div class="sc mot" id="sc-mLB"><span class="k">모터 좌후</span><b id="st-mLB">—</b><i>%</i></div>
      <div class="sc mot" id="sc-mRB"><span class="k">모터 우후</span><b id="st-mRB">—</b><i>%</i></div>
    </div>
  </section>

  <!-- 우: 흘러가는 차트 + FC 메시지 서랍.
       로그 뷰어(log.html)와 같은 배치·같은 chart.js 를 쓴다 — 지난 비행과
       지금 비행을 같은 그림으로 읽어야 눈이 안 흔들린다. -->
  <section id="chartPane">
    <div id="charts"></div>
    <!-- 하단 바. 화면 위를 한 줄도 안 쓰려고 여기 다 모았다.
         링크 상태는 글자가 아니라 점 하나다 — 초록/노랑/빨강. -->
    <div class="msgs">
      <div class="hd">
        <span id="dot" class="dot" title="링크 상태">●</span>
        <!-- 지금 데이터가 어느 경로로 오는지. ELRS(조종기 백팩) / USB(FC 직결).
             둘은 갱신 주기가 3배 넘게 차이나므로 무엇을 보고 있는지 알아야 한다. -->
        <span id="linkSrc" title="데이터 원천">—</span>
        <!-- 기록 상태. 야외(GPS fix)에서 arm 하면 저절로 켜지므로, 조종자가
             "왜 안 찍히나" 를 물어야 할 때가 온다 — 그때 답이 여기 있다.
             REC = 적는 중(어느 경로인지 같이), 실내대기 = arm 은 했는데
             GPS 를 기다린다. -->
        <span id="recSt" title="기록 상태" hidden></span>
        <span class="cnt" id="msgCnt"></span>
        <!-- 어느 단을 볼지. 차트 위에 떠 있던 것을 여기로 내렸다 —
             그림 위를 가리지 않고, 조작이 한 줄에 모인다. -->
        <div id="toc"></div>
        <span class="grow"></span>
        <!-- 재생. **버튼은 하나다.** 실시간 기록(.tlog)과 FC 로그(.ulg)는
             재생 방식이 다르지만(전자는 서버가 흘리고 후자는 브라우저가
             시각을 정한다), 고르는 사람에게 그 차이는 사정이지 선택지가
             아니다. 한 목록에서 고르면 종류에 맞는 쪽이 알아서 돈다. -->
        <span class="stats" id="stats"></span>
        <select id="win" title="차트가 보여주는 시간 창">
          <option value="60">1분</option>
          <option value="180" selected>3분</option>
          <option value="600">10분</option>
          <option value="0">전체</option>
        </select>
        <button id="pbOpen" title="지난 비행을 골라 재생한다">재생</button>
        <button id="msgToggle" title="서랍 접기/펴기">접기</button>
      </div>
      <!-- 실시간 기록(.tlog) 재생 바. 통합 피커에서 그 줄을 고르면 나온다.
           파일 고르는 select 는 없다 — 피커가 그 일을 한다. -->
      <div id="playBar" hidden>
        <span id="playName" class="stats" title="재생 중인 기록"></span>
        <button id="playToggle" title="재생/일시정지">▶</button>
        <input id="playSeek" type="range" min="0" max="1000" value="0"
               title="위치" />
        <span id="playTime" class="stats">0:00 / 0:00</span>
        <select id="playSpeed" title="배속">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
          <option value="10">10×</option>
        </select>
        <button id="playExit" title="실시간으로 돌아간다">실시간</button>
      </div>
      <div id="msgs"></div>
    </div>
  </section>
</main>

<!-- ── 로그 재생 ──────────────────────────────────────────────────
     재생 바는 화면 맨 아래에 깔린다. 켜져 있는 동안에만 보인다 —
     실시간으로 보고 있을 때 조작거리가 늘어나면 안 된다. -->
<div id="pbBar" hidden>
  <button id="pbPlay" title="재생/일시정지 (space)">▶</button>
  <span id="pbName" title="열려 있는 로그"></span>
  <input id="pbSeek" type="range" min="0" max="1000" value="0" step="1"
         title="드래그해서 원하는 지점으로">
  <span id="pbTime" class="mono">0:00 / 0:00</span>
  <select id="pbRate" title="재생 속도">
    <option value="0.5">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
    <option value="4">4×</option>
    <option value="10">10×</option>
  </select>
  <button id="pbExit" title="재생을 끝내고 실시간으로 돌아간다">실시간</button>
</div>

<!-- 로그 고르기. 목록은 /api/logs 가 최신순으로 준다. -->
<div id="pbPick" hidden>
  <div class="box">
    <div class="hd">
      <b>비행 로그 재생</b>
      <span class="grow"></span>
      <button id="pbPickClose">닫기</button>
    </div>
    <div id="pbList">불러오는 중…</div>
  </div>
</div>

<script src="/chart.js"></script>
<script src="/live.js"></script>
