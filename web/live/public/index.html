<!doctype html>
<meta charset="utf-8">
<title>SHADE01 라이브</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/live.css">

<!-- 헤더에는 링크 상태만 남긴다. ARM·모드·VTOL 은 HUD 중앙이 훨씬 크게 말하고,
     경고 배너(#banner)는 없앴다 — 배너가 뜨면 main 의 calc(100vh-49px) 가
     배너 높이만큼 넘쳐 아래 스트립이 스크롤바도 없이 화면 밖으로 사라졌다. -->
<header>
  <h1>SHADE01 <span class="muted" style="font-weight:400">라이브</span></h1>
  <span id="link" class="pill pill-off">링크 없음</span>
  <span class="grow"></span>
  <span class="muted" id="stats" style="font-size:12px"></span>
  <button id="followBtn" class="on" title="기체를 화면 가운데 유지">추적</button>
  <button id="clearBtn" title="항적·메시지 지우기">항적 지우기</button>
  <a class="btn" href="http://localhost:4399/" target="_blank" title="지난 비행 로그 뷰어">로그</a>
</header>

<main>
  <!-- 좌: HUD. DOM 순서상 먼저다 — 좁은 화면에서 그대로 위로 간다. -->
  <section id="hudPane">
    <div id="hudBox">
      <!-- viewBox 는 layout() 이 실측 픽셀로 넣는다. 여기에 미리 쓰지 마라 —
           고정 viewBox 를 두면 배율이 1:1 이 아니게 되어 45° 뱅크가 30° 로 보인다. -->
      <svg id="hud" aria-label="HUD"></svg>
    </div>

    <!-- HUD 아래 숫자 스트립. 계기가 그림으로 말하지 못하는 값만 여기 온다. -->
    <div id="strip">
      <div class="sc" id="sc-volt"><span class="k">전압</span><b id="st-volt">—</b><i id="st-cell">V</i></div>
      <div class="sc" id="sc-mah"><span class="k">소모</span><b id="st-mah">—</b><i id="st-pct">mAh</i></div>
      <div class="sc"><span class="k">스로틀</span><b id="st-thr">—</b><i>%</i></div>
      <div class="sc"><span class="k">상승률</span><b id="st-climb">—</b><i>m/s</i></div>
      <div class="sc" id="sc-home"><span class="k">홈거리</span><b id="st-home">—</b><i>/ 150 m 설정값</i></div>
      <!-- AUTO.* 가 아니면 통째로 사라진다. 멈춘 wp_dist 는 없는 숫자보다 나쁘다. -->
      <div class="sc" id="sc-wp" hidden><span class="k">WP</span><b id="st-wp">—</b><i id="st-xt"></i></div>
      <!-- 진단 칸은 색이 절대 안 붙는다 — 비행 판단값이 아니라 정비 항목이다. -->
      <div class="sc diag"><span class="k">진단</span><b id="st-air">—</b><i>대기속도 영점불량</i><b id="st-load">—</b><i>CPU%</i></div>
    </div>
  </section>

  <!-- 우: 지도 + FC 메시지 서랍 -->
  <section id="mapPane">
    <div id="map"></div>
    <div id="mapInfo" class="overlay">
      <div><span class="k">위도</span><span class="v" id="o-lat">—</span></div>
      <div><span class="k">경도</span><span class="v" id="o-lon">—</span></div>
      <div><span class="k">항적</span><span class="v" id="o-trk">—</span></div>
    </div>
    <div class="msgs">
      <div class="hd">
        <span>FC 메시지</span><span class="cnt" id="msgCnt"></span>
        <button id="msgToggle" title="서랍 접기/펴기">접기</button>
      </div>
      <div id="msgs"></div>
    </div>
  </section>
</main>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/live.js"></script>
