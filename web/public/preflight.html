<!doctype html>
<meta charset="utf-8">
<title>SHADE01 비행 전 점검</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/app.css">

<!--
  비행 전 점검 화면.

  🔴 **판정은 이 파일에서 하지 않는다.** 여기서 하는 일은 서버가 준 JSON 을
     그리는 것뿐이다. 임계값은 tools/preflight/preflight.py 의 EXPECT 한 곳에만
     있고, 터미널(`./shade01 test`)과 이 화면이 같은 코드로 같은 답을 내야
     한다. 값을 JS 에서 다시 해석하면 그 순간부터 두 벌이 따로 늙는다.

  경로: 브라우저 → 웹서버(/api/preflight) → FC 가 꽂힌 PC 의 에이전트
        → preflight.py → FC. FC 상행은 그 PC 안에 갇혀 있다.
-->

<header>
  <h1><a href="/">SHADE01 비행로그</a></h1>
  <span class="sub">비행 전 점검</span>
  <span class="grow"></span>
  <a class="btn" href="/intro">소개</a>
  <a class="btn" href="/live">실시간</a>
</header>

<main class="pf">
  <!-- 아무것도 안 한 상태의 화면은 버튼 하나다. 현장에서 한 손으로 누른다. -->
  <section class="pf-hero" id="hero">
    <button class="primary pf-big" id="go">기체 점검</button>
    <div class="pf-note" id="note"></div>
  </section>

  <!-- 결과가 있을 때만 켜지는 줄. 다시 점검·수집 시간이 여기로 옮겨 온다. -->
  <div class="pf-bar" id="bar" hidden>
    <button class="primary" id="again">다시 점검</button>
    <label class="pf-secs">수집
      <select id="secs">
        <option value="4">4초</option>
        <option value="6" selected>6초</option>
        <option value="10">10초</option>
      </select>
    </label>
    <span class="grow"></span>
    <span class="pf-note" id="note2"></span>
  </div>

  <section id="verdict" class="pf-verdict" hidden>
    <div class="pf-vbig"><span id="vtext">—</span></div>
    <div class="pf-vmeta" id="vmeta"></div>
  </section>

  <section id="fail" class="pf-fail" hidden></section>

  <section id="groups" class="pf-groups"></section>

  <section id="standing" class="pf-standing" hidden>
    <h2>기억할 것 <span class="pf-dim">(판정과 무관 — 매번 같다)</span></h2>
    <dl id="standingList"></dl>
  </section>
</main>

<!-- 암호 창. 버튼을 누르면 뜬다. -->
<div class="pf-modal" id="modal" hidden>
  <form class="pf-modalbox" id="pwForm">
    <label for="pw">암호</label>
    <input type="password" id="pw" inputmode="numeric" autocomplete="current-password">
    <div class="pf-modalerr" id="pwErr" hidden></div>
    <div class="pf-modalrow">
      <button type="button" id="cancel">취소</button>
      <button type="submit" class="primary">점검</button>
    </div>
  </form>
</div>

<script src="/preflight.js"></script>
