<style>
/* 차량 센터 디스플레이 형식 (Tesla Model 3/Y 라이트 모드 계열, 2026-09-26).
   값은 Tesla 화면 캡처에서 잰 것 — 평면(그림자 없음) 카드, 회색 단계,
   강조 파랑 하나, 검정 도크. 그림자는 3D 기체 밑에만 있다. */
@font-face { font-family: "Inter"; src: url(/vendor/inter/inter-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  --bg: #f4f4f6; --stage: #eeeef1; --card: #ededef; --line: #e1e1e3; --track: #c6c6c8;
  --ink: #171a20; --ink2: #383838; --dim: #828284; --muted: #a8a8ab;
  --acc: #3e6ae1; --ok: #1f9d55; --warn: #d99a06; --bad: #dc2626;
  --font: "Inter", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); overflow: hidden; font: 14px/1.4 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

.scr { height: 100vh; height: 100dvh; display: grid; grid-template-columns: minmax(340px, 30%) 1fr; grid-template-rows: 1fr 76px; }

/* ── 좌: 기체 상태 패널 ── */
.pane { background: var(--bg); border-right: 1px solid var(--line); padding: 18px 22px 16px; display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; scrollbar-width: none; }
.pane::-webkit-scrollbar { display: none; }
.gear { display: flex; align-items: center; gap: 14px; font-size: 13px; letter-spacing: .14em; color: var(--muted); font-weight: 500; }
.gear b { font-weight: 500; }
.gear b.on { color: var(--ink); font-weight: 700; }
.gear .grow { flex: 1; }
.gear .bat { display: flex; align-items: center; gap: 6px; letter-spacing: 0; color: var(--ink2); font-size: 15px; font-weight: 500; }
.gear .bat svg { width: 30px; height: 16px; }
.gear .bat.warn { color: var(--warn); } .gear .bat.bad { color: var(--bad); }
.spd { display: flex; align-items: flex-end; gap: 18px; }
.spd .v { font-size: 96px; font-weight: 300; line-height: .9; letter-spacing: -.04em; }
.spd .v.off { color: var(--track); }
.spd .u { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--ink2); margin-top: 6px; }
.spd .arm { margin-left: auto; margin-bottom: 8px; text-align: right; }
.spd .arm b { display: block; font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--muted); }
.spd .arm b.on { color: var(--ok); } .spd .arm b.air { color: var(--acc); }
.spd .arm span { font-size: 14px; color: var(--ink2); font-weight: 500; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.card .h { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 12px; font-weight: 500; letter-spacing: .02em; }
.card .h svg.i { width: 16px; height: 16px; }
.card .h .grow { flex: 1; }
.card .big { font-size: 17px; font-weight: 600; margin-top: 4px; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 12px; text-align: center; }
.trio b { display: block; font-size: 17px; font-weight: 500; }
.trio span { font-size: 11px; color: var(--dim); }
a.card:hover { border-color: var(--track); }

.link .row { display: flex; align-items: center; gap: 12px; }
.link .ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--track); color: #fff; flex: none; transition: background .3s; }
.link .ic.on { background: var(--acc); }
.link .nm { font-size: 16px; font-weight: 600; }
.link .sub { color: var(--dim); font-size: 12px; }
.link .trio { border-top: 1px solid var(--line); padding-top: 10px; }

.frame { display: grid; grid-template-columns: 1fr 124px; align-items: center; }
.frame .tot b { font-size: 26px; font-weight: 300; }
.frame .tot small { color: var(--dim); margin-left: 3px; font-size: 13px; }
.frame .tot span { display: block; color: var(--dim); font-size: 11px; margin-bottom: 8px; }
.frame svg.top { width: 124px; height: 124px; display: block; }
.frame svg.top text { font: 600 11px var(--font); fill: var(--dim); }
.frame svg.top text.warn { fill: var(--warn); } .frame svg.top text.bad { fill: var(--bad); }

/* ── 우: 무대 ── */
.main { position: relative; min-width: 0; min-height: 0; background: radial-gradient(ellipse 70% 60% at 50% 58%, #fbfbfc 0%, var(--stage) 70%, #e6e6ea 100%); overflow: hidden; }
.bar { position: absolute; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 18px; padding: 0 22px; z-index: 3; font-size: 14px; color: var(--ink2); font-weight: 500; }
.bar .grow { flex: 1; }
.bar .st { display: flex; align-items: center; gap: 6px; }
.bar .st svg.i { width: 18px; height: 18px; }
.bar .st.warn { color: var(--warn); } .bar .st.bad { color: var(--bad); }
.bar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--track); }
.bar .dot.on { background: var(--ok); }
.bar .me { display: flex; align-items: center; gap: 6px; }
.tabs { position: absolute; top: 56px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; z-index: 3; pointer-events: none; }
.tabs button { pointer-events: auto; background: none; border: 0; font-size: 15px; font-weight: 500; color: var(--dim); padding: 7px 16px; border-radius: 8px; cursor: pointer; }
.tabs button.on { background: #fff; color: var(--ink2); font-weight: 600; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#view.drag { cursor: grabbing; }

/* 부위 표시 — 가는 세로선 끝에 작은 대문자 이름과 회색 값 */
#calls { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.call { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -100%); transition: opacity .35s; }
.call .k { font-size: 11px; font-weight: 600; letter-spacing: .1em; color: var(--dim); }
.call .v { margin-top: 3px; background: var(--track); color: #262628; font-weight: 600; font-size: 15px; padding: 5px 10px; border-radius: 3px; white-space: nowrap; }
.call .v.warn { background: #f6d77a; } .call .v.bad { background: var(--bad); color: #fff; }
.call i { width: 1px; height: 44px; background: var(--dim); opacity: .7; }
.call i::after { content: ""; display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--dim); margin: 42px 0 0 -2px; }

.tiles { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; gap: 8px; z-index: 3; pointer-events: none; padding: 0 16px; }
.tile { pointer-events: auto; width: 128px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 10px 10px; text-align: center; }
.tile svg.i { display: block; margin: 0 auto 6px; color: var(--ink2); }
.tile b { display: block; font-size: 18px; font-weight: 600; white-space: nowrap; }
.tile b small { font-size: 12px; color: var(--dim); font-weight: 500; margin-left: 2px; }
.tile span { font-size: 12px; color: var(--dim); }
.tile.on { background: var(--acc); border-color: var(--acc); color: #fff; }
.tile.on svg.i, .tile.on span, .tile.on b small { color: #fff; }
.tile.warn b { color: var(--warn); } .tile.bad b { color: var(--bad); }
#loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 120px; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; z-index: 1; }
#loading i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .2s; }

/* ── 도크 — 라이트 모드에서도 검정 ── */
.dock { grid-column: 1 / -1; background: #000; color: #fff; display: flex; align-items: center; padding: 0 20px; gap: 4px; }
.dock a { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 10px; color: #cfcfd2; }
.dock a svg.i { width: 26px; height: 26px; }
.dock a:hover { color: #fff; background: #1c1c1e; }
.dock a.on { color: #fff; }
.dock .grow { flex: 1; }
.dock .m { display: flex; flex-direction: column; align-items: center; padding: 0 20px; line-height: 1.15; }
.dock .m span { font-size: 10px; letter-spacing: .12em; color: #8e8e93; font-weight: 600; }
.dock .m b { font-size: 21px; font-weight: 400; }
.dock .m b small { font-size: 12px; color: #8e8e93; margin-left: 2px; }

@media (max-width: 900px) {
  body { overflow: auto; }
  .scr { height: auto; min-height: 100dvh; grid-template-columns: 1fr; grid-template-rows: 64vh auto auto; }
  .pane { order: 2; border-right: 0; padding: 14px 16px; overflow: visible; }
  .main { order: 1; }
  .main .bar { display: none; }
  .tabs { top: 8px; }
  .dock { order: 4; overflow-x: auto; padding: 0 8px; position: sticky; bottom: 0; }
  .dock .m { padding: 0 10px; }
  .spd .v { font-size: 72px; }
  .bar { padding: 0 16px; gap: 12px; font-size: 13px; }
  .bar .me { display: none; }
  .tabs button { font-size: 14px; padding: 6px 10px; }
  .tiles { justify-content: flex-start; overflow-x: auto; }
  .tile { width: 104px; flex: none; }
}
</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $ = (id) => document.getElementById(id);
const txt = (id, s) => { const e = $(id); if (e && e.textContent !== s) e.textContent = s; };
const html = (id, s) => { const e = $(id); if (e && e.innerHTML !== s) e.innerHTML = s; };
const num = (v, n = 0) => (v == null || !Number.isFinite(v)) ? '—' : v.toFixed(n);
const icon = (n) => `<svg class="i"><use href="#i-${n}"/></svg>`;
const lvl = (v, warn, bad, low = true) => v == null ? '' : low ? (v < bad ? 'bad' : v < warn ? 'warn' : '') : (v > bad ? 'bad' : v > warn ? 'warn' : '');
const mins = (s) => s == null ? '—' : s < 60 ? `${Math.round(s)}초` : `${Math.floor(s / 60)}분 ${String(Math.round(s % 60)).padStart(2, '0')}초`;

let S = { live: false, d: {} };   // /api/live/state
let R = null;                      // 비행 기록 요약
let tab = 'sum';
const D = () => (S.live ? (S.d || {}) : {});

// ── 3D ───────────────────────────────────────────────────────────────
// 모델은 web/model/striver.py(Blender)가 만든 /model/striver.glb.
// 좌표: +z 기수, +y 위, 단위 m, 좌익 +x.
const canvas = $('view');
let renderer = null;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); } catch { canvas.style.display = 'none'; }

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, 1, 0.05, 50);
const craft = new THREE.Group();      // 사용자가 끌어 돌리는 것
const attitude = new THREE.Group();   // 실시간 자세
craft.add(attitude); scene.add(craft);

scene.add(new THREE.HemisphereLight(0xffffff, 0xdedee3, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(1.4, 3.4, 1.8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 6; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.01;
Object.assign(sun.shadow.camera, { left: -1.4, right: 1.4, top: 1.4, bottom: -1.4, near: 0.5, far: 8 });
scene.add(sun);
const fill = new THREE.DirectionalLight(0xf2f4ff, 0.9); fill.position.set(-2.5, 1.2, -1.5); scene.add(fill);
const front = new THREE.DirectionalLight(0xffffff, 0.5); front.position.set(0, 0.6, 3); scene.add(front);

const FLOOR = -0.125;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = FLOOR; ground.receiveShadow = true; scene.add(ground);
{ // 접지 그림자 — 기체 밑이 가장 진하고 바깥으로 사라진다
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), gr = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(40,40,48,.30)'); gr.addColorStop(.5, 'rgba(40,40,48,.10)'); gr.addColorStop(1, 'rgba(40,40,48,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 256, 256);
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.8), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  blob.rotation.x = -Math.PI / 2; blob.position.y = FLOOR + 0.001; craft.add(blob);
}

if (renderer) {
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
  // 금속 재질이 비칠 환경 — 밝은 스튜디오
  const pm = new THREE.PMREMGenerator(renderer);
  const env = new THREE.Scene();
  env.background = new THREE.Color(0xf0f0f3);
  const panel = (w, h, pos, s) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })); m.position.set(...pos); m.lookAt(0, 0, 0); m.material.color.multiplyScalar(s); env.add(m); };
  panel(6, 2, [0, 5, 0], 2.2); panel(3, 3, [5, 2, 3], 1.4); panel(3, 3, [-5, 1, -2], 1.0);
  const floorM = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshBasicMaterial({ color: 0x9a9aa0, side: THREE.DoubleSide }));
  floorM.rotation.x = -Math.PI / 2; floorM.position.y = -2; env.add(floorM);
  scene.environment = pm.fromScene(env, 0.04).texture;
  scene.environmentIntensity = 0.6;
}

// 모델이 오기 전까지 이름으로 찾는 노드 — 없으면 해당 동작만 건너뛴다
const rotors = {};          // LF/RF/LB/RB → { node, dir, v, disc }
let nose = null, anchors = {};
const discMat = new THREE.MeshBasicMaterial({ color: 0x5a5d63, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
function addDisc(node, R) {
  const d = new THREE.Mesh(new THREE.CircleGeometry(R, 64), discMat.clone());
  d.rotation.x = -Math.PI / 2; node.add(d); return d;
}
new GLTFLoader().load('/model/striver.glb', (g) => {
  const m = g.scene;
  m.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  for (const k of ['LF', 'RF', 'LB', 'RB']) {
    const n = m.getObjectByName('rotor_' + k);
    if (n) rotors[k] = { node: n, dir: (k === 'RF' || k === 'LB') ? 1 : -1, v: 0, disc: addDisc(n, 0.2) };
  }
  const pn = m.getObjectByName('prop_nose');
  if (pn) nose = { node: pn, v: 0, disc: addDisc(pn, 0.165) };
  // 부위 표시가 붙을 자리
  const at = (name, off = [0, 0, 0]) => { const n = m.getObjectByName(name); if (!n) return null; const a = new THREE.Object3D(); a.position.set(...off); n.add(a); return a; };
  anchors = {
    gps: at('gps', [0, 0.02, 0]),
    bat: (() => { const a = new THREE.Object3D(); a.position.set(0, 0.095, 0.18); m.add(a); return a; })(),
    nose: at('prop_nose'),
    LF: at('rotor_LF'), RF: at('rotor_RF'), LB: at('rotor_LB'), RB: at('rotor_RB'),
  };
  attitude.add(m);
  $('loading').remove();
  setView(tab);
}, (e) => { if (e.total) $('loading').firstChild.style.width = (100 * e.loaded / e.total) + '%'; },
() => { $('loading').remove(); });

// ── 조작 — 끌면 기체가 돈다, 휠·두 손가락은 거리, 두 번 누르면 제자리 ──
const VIEWS = {
  sum: { yaw: -2.45, tilt: 0.36, dist: 3.7 },
  pwr: { yaw: -2.75, tilt: 0.78, dist: 4.1 },
  nav: { yaw: 0.65, tilt: 0.45, dist: 3.3 },
  bat: { yaw: -1.9, tilt: 0.5, dist: 3.3 },
  rec: { yaw: -2.45, tilt: 0.36, dist: 3.7 },
};
const cam = { ...VIEWS.sum, vYaw: 0, vTilt: 0 };
const goal = { ...VIEWS.sum, on: false };
let userAt = -1e9;
const ptrs = new Map();
let pinch0 = 0, dist0 = 0;
const clampTilt = (t) => Math.max(-0.15, Math.min(1.4, t));
const clampDist = (d) => Math.max(2.0, Math.min(8, d));
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  canvas.classList.add('drag'); goal.on = false; cam.vYaw = cam.vTilt = 0; userAt = performance.now();
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); dist0 = cam.dist; }
});
canvas.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  if (ptrs.size === 1) {
    const dx = e.clientX - p[0], dy = e.clientY - p[1];
    cam.vYaw = dx * 0.008; cam.vTilt = dy * 0.006;
    cam.yaw += cam.vYaw; cam.tilt = clampTilt(cam.tilt + cam.vTilt);
  }
  p[0] = e.clientX; p[1] = e.clientY;
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    cam.dist = clampDist(dist0 * pinch0 / Math.max(1, Math.hypot(a[0] - b[0], a[1] - b[1])));
  }
  userAt = performance.now();
});
const up = (e) => { ptrs.delete(e.pointerId); if (!ptrs.size) canvas.classList.remove('drag'); };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', (e) => { e.preventDefault(); goal.on = false; cam.dist = clampDist(cam.dist * Math.exp(e.deltaY * 0.001)); userAt = performance.now(); }, { passive: false });
canvas.addEventListener('dblclick', () => setView(tab));

function setView(t) {
  const v = VIEWS[t], twoPi = Math.PI * 2;
  goal.yaw = v.yaw + Math.round((cam.yaw - v.yaw) / twoPi) * twoPi;   // 가까운 쪽으로 돈다
  goal.tilt = v.tilt; goal.dist = v.dist; goal.on = true; cam.vYaw = cam.vTilt = 0;
}

function resize() {
  const r = canvas.getBoundingClientRect();
  if (!renderer || !r.width) return;
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height;
  camera.userData.k = Math.max(1, 1.35 / camera.aspect);   // 좁으면 물러선다
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);

// ── 부위 표시 ────────────────────────────────────────────────────────
const CALLS = {
  sum: (d) => [['gps', 'GPS', d.sats != null ? `${d.sats}기` : '—', lvl(d.sats, 8, 5)],
               ['bat', 'BATTERY', d.batt_pct != null ? `${d.batt_pct}%` : '—', lvl(d.batt_pct, 35, 20)]],
  pwr: (d) => { const m = d.motors || {}; const f = (k) => m[k] != null ? `${Math.round(m[k])}%` : '—';
    return [['LF', 'LF', f('LF')], ['RF', 'RF', f('RF')], ['LB', 'LB', f('LB')], ['RB', 'RB', f('RB')],
            ['nose', 'CRUISE', d.vtol === 'FW' ? 'ON' : '—']]; },
  nav: (d) => [['gps', 'GPS', d.sats != null ? `${d.sats}기 · ${num(d.eph, 1)}m` : '—', lvl(d.sats, 8, 5)],
               ['nose', 'HEADING', d.hdg != null ? `${Math.round(d.hdg)}°` : '—']],
  bat: (d) => [['bat', 'BATTERY', d.volt != null ? `${d.volt.toFixed(1)}V · ${num(d.cur, 1)}A` : '—', lvl(d.batt_pct, 35, 20)]],
  rec: () => [],
};
const callEls = new Map();
function renderCalls() {
  const want = CALLS[tab](D());
  const keep = new Set();
  for (const [a, k, v, c] of want) {
    keep.add(a);
    let el = callEls.get(a);
    if (!el) {
      el = document.createElement('div'); el.className = 'call';
      el.innerHTML = '<span class="k"></span><span class="v"></span><i></i>';
      $('calls').append(el); callEls.set(a, el);
    }
    el.children[0].textContent = k;
    el.children[1].textContent = v;
    el.children[1].className = 'v ' + (c || '');
  }
  for (const [a, el] of callEls) if (!keep.has(a)) { el.remove(); callEls.delete(a); }
}
const tmpV = new THREE.Vector3();
function placeCalls() {
  const r = canvas.getBoundingClientRect();
  const moving = goal.on && Math.abs(goal.yaw - cam.yaw) + Math.abs(goal.tilt - cam.tilt) > 0.08;
  for (const [a, el] of callEls) {
    const o = anchors[a];
    if (!o) { el.style.opacity = 0; continue; }
    o.getWorldPosition(tmpV); tmpV.project(camera);
    const x = (tmpV.x + 1) / 2 * r.width, y = (1 - tmpV.y) / 2 * r.height;
    el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%)`;
    el.style.opacity = moving || y < 150 ? 0 : 1;   // 시점이 크게 바뀌는 동안은 숨긴다
  }
}

// ── 그리기 ───────────────────────────────────────────────────────────
const timer = new THREE.Timer();
function frame() {
  requestAnimationFrame(frame);
  if (!renderer) return;
  timer.update();
  const dt = Math.min(timer.getDelta(), 0.05);
  if (goal.on) {
    const k = 1 - Math.exp(-dt * 3.2);
    cam.yaw += (goal.yaw - cam.yaw) * k; cam.tilt += (goal.tilt - cam.tilt) * k; cam.dist += (goal.dist - cam.dist) * k;
    if (Math.abs(goal.yaw - cam.yaw) < 0.003 && Math.abs(goal.tilt - cam.tilt) < 0.003) goal.on = false;
  } else if (!ptrs.size) {
    cam.yaw += cam.vYaw; cam.tilt = clampTilt(cam.tilt + cam.vTilt);
    cam.vYaw *= 0.93; cam.vTilt *= 0.88;
  }
  craft.rotation.y = cam.yaw;
  const dist = cam.dist * (camera.userData.k || 1);
  camera.position.set(0, Math.sin(cam.tilt) * dist + 0.02, Math.cos(cam.tilt) * dist);
  camera.lookAt(0, 0.02, 0);

  // 실시간 자세 — 기체가 붙어 있을 때만, 없으면 수평으로 돌아온다
  const d = D();
  const tr = d.roll != null ? THREE.MathUtils.degToRad(d.roll) : 0;
  const tp = d.pitch != null ? THREE.MathUtils.degToRad(d.pitch) : 0;
  const ka = 1 - Math.exp(-dt * 6);
  attitude.rotation.order = 'YXZ';
  attitude.rotation.z += (tr - attitude.rotation.z) * ka;
  attitude.rotation.x += (-tp - attitude.rotation.x) * ka;

  // 로터 — ARM 이고 출력이 있으면 돈다. 빨라지면 날 대신 원판이 보인다.
  const mt = d.motors || {};
  for (const [k, r] of Object.entries(rotors)) {
    const pct = d.armed ? (mt[k] ?? 0) : 0;
    r.v += ((pct > 0 ? 10 + pct * 0.6 : 0) - r.v) * (1 - Math.exp(-dt * 2));
    r.node.rotateY(r.dir * r.v * dt);
    r.disc.material.opacity = Math.min(0.09, Math.max(0, (r.v - 12) / 200));
  }
  if (nose) {
    const on = d.armed && (d.vtol === 'FW' || /TRANSITION/.test(d.vtol || ''));
    nose.v += ((on ? 50 : 0) - nose.v) * (1 - Math.exp(-dt * 2));
    nose.node.rotateY(nose.v * dt);
    nose.disc.material.opacity = Math.min(0.09, Math.max(0, (nose.v - 12) / 200));
  }
  renderer.render(scene, camera);
  placeCalls();
}
frame();

// ── 탭·타일 ──────────────────────────────────────────────────────────
const TILES = {
  sum: (d) => [
    ['alt', '고도', num(d.alt, 1), 'm'],
    ['spd', '대지속도', num(d.groundspeed, 1), 'm/s'],
    ['air', '대기속도', num(d.airspeed, 1), 'm/s'],
    ['climb', '상승률', num(d.climb, 1), 'm/s'],
    ['hdg', '헤딩', num(d.hdg), '°'],
  ],
  pwr: (d) => {
    const m = d.motors || {};
    return [['LF', '좌전'], ['RF', '우전'], ['LB', '좌후'], ['RB', '우후']]
      .map(([k, l]) => ['rotor', l, num(m[k]), '%', '', d.armed && m[k] > 0])
      .concat([['air', '크루즈', d.vtol === 'FW' ? 'ON' : '—', '', '', d.armed && d.vtol === 'FW']]);
  },
  nav: (d) => [
    ['sat', '위성', num(d.sats), '기', lvl(d.sats, 8, 5)],
    ['pin', '수평 오차', num(d.eph, 1), 'm', lvl(d.eph, 3, 6, false)],
    ['pin', '위도', num(d.lat, 5), ''],
    ['pin', '경도', num(d.lon, 5), ''],
    ['hdg', '헤딩', num(d.hdg), '°'],
  ],
  bat: (d) => [
    ['bat', '잔량', num(d.batt_pct), '%', lvl(d.batt_pct, 35, 20)],
    ['volt', '전압', num(d.volt, 2), 'V'],
    ['cur', '전류', num(d.cur, 1), 'A'],
    ['temp', '온도', num(d.batt_temp, 1), '°C'],
  ],
  rec: () => R ? [
    ['count', '비행 횟수', String(R.n), '회'],
    ['time', '누적 비행', num(R.min), '분'],
    ['alt', '최고 고도', num(R.alt, 1), 'm'],
    ['spd', '최대 속도', num(R.spd, 1), 'm/s'],
    ['cur', '최대 전류', num(R.cur), 'A'],
  ] : [],
};
function renderTiles() {
  html('tiles', TILES[tab](D()).map(([ic, l, v, u, c, on]) =>
    `<div class="tile ${c || ''}${on ? ' on' : ''}">${icon(ic)}<b class="num">${v}${u && v !== '—' ? `<small>${u}</small>` : ''}</b><span>${l}</span></div>`).join(''));
  renderCalls();
}
$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.t;
  for (const x of $('tabs').children) x.classList.toggle('on', x === b);
  setView(tab); renderTiles();
});

// ── 상태 반영 ────────────────────────────────────────────────────────
function render() {
  const on = !!S.live, d = D();
  txt('spd', d.groundspeed != null ? d.groundspeed.toFixed(0) : '—');
  $('spd').classList.toggle('off', d.groundspeed == null);
  txt('mode', d.mode || '—');
  const arm = $('arm');
  txt('arm', !on ? 'OFFLINE' : d.armed ? (d.landed === 2 ? 'AIRBORNE' : 'ARMED') : 'DISARMED');
  arm.className = on && d.armed ? (d.landed === 2 ? 'air' : 'on') : '';
  const vt = d.vtol || '';
  $('gMC').className = vt === 'MC' ? 'on' : '';
  $('gTR').className = /TRANSITION/.test(vt) ? 'on' : '';
  $('gFW').className = vt === 'FW' ? 'on' : '';
  txt('bat', d.batt_pct != null ? d.batt_pct + ' %' : '—');
  $('batBox').className = 'bat ' + lvl(d.batt_pct, 35, 20);
  $('batFill').setAttribute('width', d.batt_pct != null ? (21 * Math.max(0, Math.min(100, d.batt_pct)) / 100).toFixed(1) : 0);

  txt('sat', d.sats != null ? String(d.sats) : '—');
  $('stSat').className = 'st ' + (d.fix != null && d.fix < 3 ? 'bad' : lvl(d.sats, 8, 5));
  $('linkDot').className = 'dot' + (on ? ' on' : '');
  txt('barLink', on ? (S.link || S.src || 'LINK') : '—');

  $('linkIc').className = 'ic' + (on ? ' on' : '');
  txt('linkNm', on ? (S.link || S.src || '연결') : '링크 없음');
  txt('linkSub', (S.relay && S.relay.pusher) || '—');
  txt('lkPkt', on && S.packets ? S.packets.toLocaleString() : '—');
  txt('lkAge', on && S.relay && S.relay.age != null ? S.relay.age.toFixed(1) + 's' : '—');
  txt('lkUp', on && S.uptime ? mins(S.uptime) : '—');

  const mt = d.motors || {};
  const vs = Object.values(mt).filter((v) => v != null);
  const spread = vs.length ? Math.max(...vs) - Math.min(...vs) : 0;   // live.js 와 같은 기준 10/20%p
  for (const k of ['LF', 'RF', 'LB', 'RB']) {
    const e = $('m' + k);
    e.textContent = mt[k] == null ? '—' : Math.round(mt[k]) + '%';
    e.setAttribute('class', spread > 20 ? 'bad' : spread > 10 ? 'warn' : '');
  }

  const withU = (v, u) => v === '—' ? v : `${v}<small>${u}</small>`;
  html('dAlt', withU(num(d.alt, 1), 'm'));
  html('dClimb', withU(num(d.climb, 1), 'm/s'));
  html('dHdg', withU(num(d.hdg), '°'));
  html('dVolt', withU(num(d.volt, 1), 'V'));
  renderTiles();
}

function renderRec() {
  if (!R) return;
  txt('totMin', num(R.min)); txt('totN', String(R.n));
  const L = R.last;
  if (!L) return;
  $('lastCard').href = '/log/' + L.id;
  const t = new Date(L.utc + 'Z'), two = (n) => String(n).padStart(2, '0');
  txt('lastWhen', `${t.getFullYear()}.${two(t.getMonth() + 1)}.${two(t.getDate())} ${two(t.getHours())}:${two(t.getMinutes())}`);
  txt('lastBadge', { flight: '비행', hover: '호버' }[L.badge] || '');
  txt('lastDur', mins(L.duration));
  txt('lastAlt', L.alt_max != null ? L.alt_max.toFixed(1) + 'm' : '—');
  txt('lastCur', L.cur_max != null ? L.cur_max.toFixed(0) + 'A' : '—');
}

async function pollLive() {
  try {
    const r = await fetch('/api/live/state?track=0', { cache: 'no-store' });
    if (r.ok) S = await r.json();
  } catch { S = { live: false, d: {} }; }
  render();
  setTimeout(pollLive, S.live ? 1000 : 4000);
}
async function loadRec() {
  try {
    const r = await fetch('/api/logs', { cache: 'no-store' });
    const rows = (await r.json()).filter((x) => !x.error && !x.corrupt && x.badge && x.badge !== 'ground');
    rows.sort((a, b) => (b.utc || '').localeCompare(a.utc || ''));
    const max = (k) => rows.reduce((m, x) => x[k] != null && x[k] > m ? x[k] : m, 0);
    R = { n: rows.length, min: rows.reduce((s, x) => s + (x.duration || 0), 0) / 60,
      alt: max('alt_max'), spd: max('speed_max'), cur: max('cur_max'), last: rows[0] };
    renderRec(); if (tab === 'rec') renderTiles();
  } catch {}
}
function tick() { const n = new Date(); txt('clk', `${String(n.getHours()).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')}`); }
tick(); setInterval(tick, 5000);
render(); pollLive(); loadRec(); setInterval(loadRec, 60000);
</script>
</html>
