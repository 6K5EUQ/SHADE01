<!doctype html>
<meta charset="utf-8">
<title>비행 분석 — SHADE01</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
  /* 지도와 그래프 반반. 좁아지면 위아래로 쌓는다. */
  /* 3열 2행. 지도는 위 가운데 한 칸이고 나머지 다섯 칸이 차트다.
     지도가 화면 절반을 먹지 않으면서도 궤적을 보기엔 충분한 크기가 된다. */
  .wrap { display: grid; height: calc(100vh - 96px);
          grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; }
  @media (max-width: 1100px) {
    .wrap { grid-template-columns: 1fr; grid-template-rows: none; height: auto; }
  }

  #map { width: 100%; height: 100%; min-height: 200px; background: #0d1117; }
  .mapcell { position: relative; border-right: 1px solid var(--border);
             border-bottom: 1px solid var(--border); }
  @media (max-width: 1100px) { .mapcell { height: 52vh; order: -1; } }

  .chart { position: relative; display: flex; flex-direction: column;
           min-height: 0; min-width: 0;
           border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  @media (max-width: 1100px) { .chart { height: 180px; } }
  .chart h3 { margin: 0; padding: 5px 12px 0; font-size: 11px; font-weight: 600;
              color: var(--dim); display: flex; gap: 10px; align-items: baseline;
              flex: 0 0 auto; }
  .chart h3 .k { font-weight: 600; font-size: 11px; }
  /* 헤더 줄을 없앤 대신 파일명은 첫 단 오른쪽 끝에 둔다 */
  .chart h3 .fname { margin-left: auto; color: var(--muted); font-weight: 400;
                     font-family: var(--mono); font-size: 11px; }
  .chart svg { display: block; width: 100%; flex: 1 1 auto; min-height: 0;
               cursor: crosshair; touch-action: none; }
  /* 아래 고정 줄 — 읽기 패널 + 재생 조작 */
  .bottom { border-top: 1px solid var(--border-2); }

  /* 재생 조작 */
  .player { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
            border-top: 1px solid var(--border-2); background: var(--panel); }
  .player input[type=range] { flex: 1; accent-color: var(--accent); }
  .player .t { font-family: var(--mono); font-size: 12px; min-width: 96px;
               font-variant-numeric: tabular-nums; }

  /* 순간값 읽기 패널 */
  /* 값 칸을 고정폭으로 잡아 자릿수가 바뀌어도 항목이 밀리지 않게 한다 */
  .readout { display: flex; flex-wrap: wrap; align-items: baseline;
             gap: 2px 4px; padding: 7px 12px;
             border-top: 1px solid var(--border); background: var(--panel-2);
             font-size: 12px; }
  .readout span { color: var(--muted); margin-left: 12px; }
  .readout span:first-child { margin-left: 0; }
  .readout b.v { font-family: var(--mono); font-variant-numeric: tabular-nums;
                 font-weight: 600; display: inline-block; text-align: right; }
  .readout i.u { font-style: normal; color: var(--muted); font-size: 11px;
                 display: inline-block; width: 2.6em; }

  .maptools { position: absolute; z-index: 400; right: 10px; top: 10px;
              display: flex; gap: 6px; }
  .maptools .btn, .maptools button { background: rgba(22,27,34,.92);
              backdrop-filter: blur(4px); text-decoration: none; line-height: 1.5; }

  /* 아래 리포트 */
  .report { padding: 20px; border-top: 1px solid var(--border-2); }
  .report h2 { font-size: 14px; margin: 0 0 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
           gap: 12px; margin-bottom: 22px; }
  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: 8px; padding: 12px 14px; }
  .card .l { font-size: 11px; color: var(--muted); }
  .card .v { font-size: 19px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .finding { border-left: 3px solid var(--bad); background: var(--panel);
             padding: 9px 12px; margin-bottom: 8px; border-radius: 0 6px 6px 0; }
  .finding .cat { font-size: 11px; color: var(--bad); font-weight: 600; }
  .finding .fix { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .good { border-left: 3px solid var(--ok); background: var(--panel);
          padding: 7px 12px; margin-bottom: 6px; border-radius: 0 6px 6px 0; font-size: 13px; }
  .evt { font-family: var(--mono); font-size: 12px; padding: 2px 0;
         border-bottom: 1px solid var(--border); cursor: pointer; }
  .evt:hover { background: var(--panel); }
  .warnbox { background: #2d2118; border: 1px solid #4a3524; color: #e3b341;
             padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
</style>

<div id="banner"></div>

<div class="wrap" id="wrap"></div>

<!-- 지도 셀은 자바스크립트가 차트들 사이(위 가운데)에 끼워 넣는다 -->
<template id="mapTpl">
  <div class="mapcell">
    <div id="map"></div>
    <!-- 헤더 줄을 없앤 대신 목록으로 돌아갈 길은 여기 남긴다. -->
    <div class="maptools">
      <a class="btn" href="/" title="목록으로">←</a>
      <button id="tileBtn">위성</button>
      <button id="fitBtn">전체</button>
    </div>
  </div>
</template>

<div class="bottom">
    <div class="readout" id="readout"></div>
    <div class="player">
      <button id="play" title="스페이스">▶</button>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1">
      <span class="t" id="tlabel">0.0 / 0.0 s</span>
      <button id="zoomOut" title="시간축 전체 보기 (그래프 더블클릭도 같다)"
              style="display:none">전체 구간</button>
      <select id="speed" style="padding:4px 6px">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
        <option value="10">10×</option>
      </select>
    </div>
</div>

<div class="report" id="report"></div>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/chart.js"></script>
<script src="/player.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const ID = location.pathname.split('/').pop();
const SHADE_UUID_PREFIX = '00060000000031323438';   // 이 기체. 다르면 배너를 띄운다.
// 타일이 있는 것보다 더 당길 수 있게 둔다. 궤적을 가까이 볼 때 쓰인다.
const MAX_ZOOM = 22;

let SUM = null, TRK = null, LOGNAME = '', map, track, marker, homeMk, startMk, endMk;
let tiles = {}, tileMode = 'osm';

const f1 = (v, u) => v == null ? '–' : v.toFixed(1) + (u || '');
const f2 = (v, u) => v == null ? '–' : v.toFixed(2) + (u || '');

// ── 지도 ─────────────────────────────────────────────────────────────
function initMap() {
  map = L.map('map', { zoomControl: true, attributionControl: true, maxZoom: MAX_ZOOM });
  // 🔴 레이어를 붙이기 전에 뷰를 반드시 정한다. 뷰가 없는 지도에 Path 를 추가하면
  //    Leaflet 이 whenReady 로 미뤘다가 SVG 렌더러의 _bounds 가 없는 상태에서
  //    _clipPoints 를 돌려 터진다 (intersects → undefined.min). 아래 fitBounds 가
  //    실제 범위로 다시 맞춘다.
  map.setView([36.5, 127.8], 6);
  // maxZoom 은 지도를 얼마나 당길 수 있는지, maxNativeZoom 은 타일이 실제로
  // 존재하는 한계다. 둘을 같게 두면 그 너머로 당겼을 때 없는 타일을 요청하는데,
  // Esri 는 없어도 404 가 아니라 "Map data not yet available" 안내 이미지를
  // HTTP 200 으로 돌려줘 Leaflet 이 오류로 걸러내지 못한다 — 지도가 통째로
  // 회색 안내판이 된다. maxNativeZoom 을 주면 마지막 타일을 확대해서 쓴다.
  // 흐릿해질 뿐 궤적 벡터는 선명하므로 근접 확인에 지장이 없다.
  //
  // 실측 (비행장 35.181, 128.554): OSM 은 z19 까지, Esri 는 **z18 까지**.
  // z19 부터 Esri 는 2,521바이트 안내 타일을 준다. 지역마다 다르므로 다른
  // 비행장에서 회색판이 나오면 이 값을 낮춰라.
  tiles.osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: MAX_ZOOM, maxNativeZoom: 19, attribution: '© OpenStreetMap',
  });
  tiles.sat = L.tileLayer(
    'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: MAX_ZOOM, maxNativeZoom: 18, attribution: 'Esri World Imagery' });
  tiles.osm.addTo(map);

  $('#tileBtn').onclick = () => {
    map.removeLayer(tiles[tileMode]);
    tileMode = tileMode === 'osm' ? 'sat' : 'osm';
    tiles[tileMode].addTo(map);
    $('#tileBtn').textContent = tileMode === 'osm' ? '위성' : '지도';
  };
  $('#fitBtn').onclick = () => { if (track) map.fitBounds(track.getBounds(), { padding: [24, 24] }); };
}

/** 궤적을 고도로 색칠한다. 한 폴리라인으로는 색을 못 바꾸므로 구간을 쪼갠다. */
function drawTrack() {
  const pts = [];
  for (let i = 0; i < TRK.n; i++) {
    const la = TRK.lat && TRK.lat[i], lo = TRK.lon && TRK.lon[i];
    if (la == null || lo == null) { pts.push(null); continue; }
    pts.push([la, lo, TRK.alt ? TRK.alt[i] : null, i]);
  }
  const valid = pts.filter(Boolean);
  if (!valid.length) {
    $('#map').innerHTML = '<p class="muted" style="padding:20px">GPS 위치가 없는 로그다.</p>';
    return;
  }
  let altMax = 0;
  for (const p of valid) if (p[2] != null && p[2] > altMax) altMax = p[2];
  altMax = Math.max(altMax, 1);

  const grp = L.layerGroup().addTo(map);
  const SEG = 4;                                  // 4점씩 묶어 그린다 (선 수를 줄인다)
  for (let i = 0; i + 1 < valid.length; i += SEG) {
    const chunk = valid.slice(i, i + SEG + 1);
    const a = chunk[Math.floor(chunk.length / 2)][2];
    L.polyline(chunk.map((p) => [p[0], p[1]]), {
      color: altColor((a ?? 0) / altMax), weight: 3.5, opacity: .95,
    }).addTo(grp);
  }
  track = L.polyline(valid.map((p) => [p[0], p[1]]), { opacity: 0 }).addTo(map);

  // 🔴 뷰를 먼저 정한다. circleMarker·marker 는 추가되는 즉시 좌표를 투영하는데,
  //    center/zoom 이 없으면 Leaflet 내부에서 터진다.
  map.fitBounds(track.getBounds(), { padding: [24, 24] });

  startMk = L.circleMarker(valid[0].slice(0, 2), {
    radius: 6, color: '#3fb950', fillColor: '#3fb950', fillOpacity: .9, weight: 2,
  }).addTo(map).bindTooltip('이륙');
  endMk = L.circleMarker(valid[valid.length - 1].slice(0, 2), {
    radius: 6, color: '#f85149', fillColor: '#f85149', fillOpacity: .9, weight: 2,
  }).addTo(map).bindTooltip('착륙');

  marker = L.marker(valid[0].slice(0, 2), { icon: planeIcon(0) }).addTo(map);

  // 고도 범례
  const lg = L.control({ position: 'bottomleft' });
  lg.onAdd = () => {
    const d = L.DomUtil.create('div');
    d.style.cssText = 'background:rgba(22,27,34,.92);padding:6px 9px;border-radius:6px;' +
      'color:#e6edf3;font-size:11px;line-height:1.6';
    const bar = [0, .25, .5, .75, 1].map((v) =>
      `<span style="display:inline-block;width:18px;height:9px;background:${altColor(v)}"></span>`).join('');
    d.innerHTML = `고도 (arm 기준)<br>${bar}<br>
      <span style="color:#8b949e">0 m</span> …
      <span style="color:#8b949e">${altMax.toFixed(0)} m</span>`;
    return d;
  };
  lg.addTo(map);
}

function altColor(f) {
  f = Math.max(0, Math.min(1, f));
  const stops = [[33, 46, 80], [56, 139, 253], [63, 185, 80], [210, 153, 34], [248, 81, 73]];
  const x = f * (stops.length - 1), i = Math.min(Math.floor(x), stops.length - 2), k = x - i;
  const c = stops[i].map((v, j) => Math.round(v + (stops[i + 1][j] - v) * k));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function planeIcon(deg) {
  return L.divIcon({
    className: '', iconSize: [22, 22], iconAnchor: [11, 11],
    html: `<svg width="22" height="22" viewBox="0 0 22 22"
             style="transform:rotate(${deg}deg);transition:transform .08s linear">
        <circle cx="11" cy="11" r="9" fill="rgba(13,17,23,.75)" stroke="#e6edf3" stroke-width="1.2"/>
        <path d="M11 3 L15 15 L11 12.5 L7 15 Z" fill="#e6edf3"/></svg>`,
  });
}

// ── 차트 ─────────────────────────────────────────────────────────────
// 차트 5개 + 지도. 배치는 3열 2행이고 지도는 위 가운데다 (아래 .wrap 참조).
// 고르는 기준은 "사고를 설명할 때 실제로 본 것":
//   고도·속도  — 떴는지, 어떻게 움직였는지. 모든 판독의 출발점
//   전류·모터  — 45A 초과와 모터 불균형. 이 기체의 최대 현안
//   조종 vs 반응 — 스로틀을 내렸는데 안 내려가는가. #184 의 핵심 증거
//   자세       — 경사. 제어 상실 판별
//   전압       — 셀 처짐. 전류와 짝
const CHARTS = [
  { id: 'c1', bands: true, events: true, series: [
      { key: 'alt', color: 'var(--c-alt)', label: '고도', axis: 'left', weight: 2 },
      { key: 'spd', color: 'var(--c-spd)', label: '속도', axis: 'right' }] },
  { id: 'c2', bands: true, events: false, series: [
      { key: 'cur', color: 'var(--c-cur)', label: '전류', axis: 'left', weight: 2.2 }],
    motorsOn: 'right',
    thresholds: [{ v: 45, label: '45A', color: '#d29922' },
                 { v: 90, label: '90A', color: '#f85149' }] },
  // 스로틀(조종 지시)과 상승률(실제 반응)을 겹쳐 둔다. 둘이 어긋나는 구간이
  // 곧 "내 말을 안 듣는" 구간이다 — #184 는 이게 20초 넘게 이어졌다.
  { id: 'c3', bands: true, events: true, series: [
      { key: 'stick_throttle', color: 'var(--c-thr)', label: '스로틀', axis: 'left', weight: 2 },
      { key: 'climb', color: 'var(--c-alt)', label: '상승률', axis: 'right' }] },
  { id: 'c4', bands: true, events: false, series: [
      { key: 'roll', color: 'var(--c-roll)', label: '롤', axis: 'left' },
      { key: 'pitch', color: 'var(--c-pitch)', label: '피치', axis: 'left' }] },
  { id: 'c5', bands: true, events: false, series: [
      { key: 'volt', color: 'var(--c-volt)', label: '전압', axis: 'left' }] },
];
function cssVar(v) {
  return v.startsWith('var(') ?
    getComputedStyle(document.documentElement).getPropertyValue(v.slice(4, -1)).trim() : v;
}

function buildCharts() {
  // 모터는 살아 있는 채널만 (control[0] 이 미사용인 기체가 있다)
  const mc = ['#58a6ff', '#3fb950', '#f0883e', '#db61a2', '#a371f7', '#d29922'];
  const motors = TRK.motors || {};
  for (const c of CHARTS) {
    if (!c.motorsOn) continue;
    c.series = c.series.concat(Object.keys(motors).sort().map((k, i) => {
      TRK['m' + k] = motors[k];
      return { key: 'm' + k, color: mc[i % mc.length], label: 'M' + k,
               axis: c.motorsOn, weight: 1, dim: true };
    }));
  }

  // 3열 2행에 [차트, 지도, 차트 / 차트, 차트, 차트] 로 놓는다.
  // 지도는 위 가운데(2번째 칸)에 끼운다.
  const live = CHARTS.filter((c) => c.series.length);
  const wrap = $('#wrap');
  wrap.innerHTML = '';
  const MAP_SLOT = 1;
  let ci = 0;
  for (let slot = 0; slot < live.length + 1; slot++) {
    if (slot === MAP_SLOT) {
      wrap.appendChild(document.getElementById('mapTpl').content.cloneNode(true));
      continue;
    }
    const c = live[ci++];
    const d = document.createElement('div');
    d.className = 'chart';
    // 제목에는 계열 이름을 그 계열 색으로만 쓴다 — 같은 말을 회색으로 또 적지 않는다.
    // 첫 칸 오른쪽에는 보고 있는 로그 파일명을 둔다 (헤더 줄을 없앤 자리다).
    d.innerHTML = `<h3>${c.series.map((x) =>
        `<span class="k" style="color:${cssVar(x.color)}">${x.label}</span>`).join('')}
      ${ci === 1 ? `<span class="fname">${LOGNAME}</span>` : ''}</h3>
      <svg id="${c.id}"></svg>`;
    wrap.appendChild(d);
  }
  CHARTS_LIVE = live;

  redraw();
}

let svgs = [], CHARTS_LIVE = [];
// 보이는 시간 구간. 두 차트가 같은 값을 쓰므로 확대·이동이 함께 움직인다.
let VIEW = null;

/** 화면 x(px) → 로그 시각(s). viewBox 가 있으므로 CSS 폭으로 환산해야 한다. */
function timeAtEvent(el, clientX) {
  const r = el.getBoundingClientRect();
  const g = el._geom;
  const px = ((clientX - r.left) / r.width) * g.W;      // viewBox 좌표로
  return g.tAt(px);
}

function setView(t0, t1) {
  const MIN = 0.5;                                      // 0.5초보다 좁게는 안 줄인다
  let a = Math.max(0, t0), b = Math.min(TRK.dur, t1);
  if (b - a < MIN) {
    const c = (a + b) / 2;
    a = Math.max(0, c - MIN / 2); b = Math.min(TRK.dur, a + MIN);
  }
  // 전체를 보고 있으면 VIEW 를 비워 둔다 (기본 상태)
  VIEW = (a <= 0.001 && b >= TRK.dur - 0.001) ? null : { t0: a, t1: b };
  $('#zoomOut').style.display = VIEW ? '' : 'none';
  redraw();
}

function redraw() {
  svgs = [];
  for (const c of CHARTS_LIVE) {
    const el = document.getElementById(c.id);
    if (!el) continue;
    drawChart(el, TRK, {
      series: c.series.map((s) => ({ ...s, color: cssVar(s.color) })),
      bands: c.bands, events: c.events, thresholds: c.thresholds, view: VIEW,
    });
    svgs.push(el);
    bindChartInput(el);
  }
  if (player) player.apply();
}

/** 휠=줌, 드래그=이동, 클릭=그 시각으로, 더블클릭=전체 */
function bindChartInput(el) {
  if (el._bound) return;                                // redraw 마다 다시 걸지 않는다
  el._bound = true;

  el.addEventListener('wheel', (e) => {
    e.preventDefault();                                 // 페이지가 같이 스크롤되면 못 쓴다
    const g = el._geom;
    if (!g) return;
    const at = timeAtEvent(el, e.clientX);              // 커서 아래 시각을 고정점으로
    const k = e.deltaY < 0 ? 0.8 : 1.25;                // 위로 굴리면 확대
    const a = at - (at - g.v0) * k;
    const b = at + (g.v1 - at) * k;
    setView(a, b);
  }, { passive: false });

  let drag = null;
  el.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    drag = { x: e.clientX, t: timeAtEvent(el, e.clientX), moved: false,
             v0: el._geom.v0, v1: el._geom.v1 };
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', (e) => {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.x) < 3) return;       // 클릭과 구분
    drag.moved = true;
    const g = el._geom;
    const r = el.getBoundingClientRect();
    const dt = ((e.clientX - drag.x) / r.width) * (drag.v1 - drag.v0);
    let a = drag.v0 - dt, b = drag.v1 - dt;
    const w = b - a;
    if (a < 0) { a = 0; b = w; }
    if (b > TRK.dur) { b = TRK.dur; a = b - w; }
    setView(a, b);
  });
  el.addEventListener('pointerup', (e) => {
    if (drag && !drag.moved) player.seek(timeAtEvent(el, e.clientX));
    drag = null;
  });
  el.addEventListener('pointercancel', () => { drag = null; });
  el.addEventListener('dblclick', () => setView(0, TRK.dur));
}

// ── 재생 ─────────────────────────────────────────────────────────────
let player;
function initPlayer() {
  player = makePlayer({
    dur: TRK.dur,
    onTick(t) {
      const i = Math.max(0, Math.min(TRK.n - 1, Math.round(t * TRK.hz)));
      moveCursors(svgs, t);
      if (marker && TRK.lat && TRK.lat[i] != null && TRK.lon[i] != null) {
        marker.setLatLng([TRK.lat[i], TRK.lon[i]]);
        const hd = TRK.hdg && TRK.hdg[i];
        if (hd != null) marker.setIcon(planeIcon(hd));
      }
      $('#tlabel').textContent = `${t.toFixed(1)} / ${TRK.dur.toFixed(1)} s`;
      $('#seek').value = String(Math.round((t / TRK.dur) * 1000));
      drawReadout(i, t);
    },
  });
  $('#play').onclick = () => player.toggle();
  $('#seek').oninput = (e) => player.seek((e.target.value / 1000) * TRK.dur);
  $('#speed').onchange = (e) => player.setRate(parseFloat(e.target.value));
  $('#zoomOut').onclick = () => setView(0, TRK.dur);
  addEventListener('keydown', (e) => {
    if (e.target.matches('input,select,textarea')) return;
    if (e.code === 'Space') { e.preventDefault(); player.toggle(); }
    if (e.code === 'ArrowRight') player.seek(player.t + (e.shiftKey ? 10 : 1));
    if (e.code === 'ArrowLeft') player.seek(player.t - (e.shiftKey ? 10 : 1));
  });
}

// [라벨, 키, 소수자리, 단위, 값칸 폭(문자수)]
// 폭을 고정하지 않으면 5.8 → 12.3 처럼 자릿수가 바뀔 때마다 뒤 항목이 밀려
// 재생 중에 패널 전체가 흔들린다. 값은 오른쪽 정렬, 단위는 그 뒤에 고정폭으로 둔다.
const RD = [
  ['고도', 'alt', 1, 'm', 6], ['속도', 'spd', 1, 'm/s', 5], ['상승률', 'climb', 1, 'm/s', 5],
  ['전류', 'cur', 1, 'A', 5], ['전압', 'volt', 2, 'V', 6],
  ['롤', 'roll', 0, '°', 4], ['피치', 'pitch', 0, '°', 4], ['기수', 'hdg', 0, '°', 4],
  ['스로틀', 'stick_throttle', 2, '', 5],
];
function drawReadout(i, t) {
  const mode = curMode(t);
  let h = `<span>모드</span><b class="v" style="width:7.5em;color:${
    cssVar('var(--accent)')}">${mode}</b>`;
  for (const [label, key, d, u, w] of RD) {
    const a = TRK[key];
    if (!a) continue;
    const v = a[i];
    h += `<span>${label}</span><b class="v" style="width:${w}ch">${
      v == null ? '–' : v.toFixed(d)}</b>${u ? `<i class="u">${u}</i>` : ''}`;
  }
  $('#readout').innerHTML = h;
}
function curMode(t) {
  let m = '–';
  for (const x of (TRK.modes || [])) { if (x.t <= t) m = x.name; else break; }
  return m;
}

// ── 리포트 ───────────────────────────────────────────────────────────
function drawReport() {
  const s = SUM;
  const card = (l, v) => `<div class="card"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  let h = '<div class="cards">';
  h += card('비행시간', s.duration == null ? '–' :
    (s.duration < 60 ? s.duration.toFixed(0) + '초'
      : Math.floor(s.duration / 60) + '분 ' + Math.round(s.duration % 60) + '초'));
  h += card('최고고도 <span class="muted">(arm 기준)</span>', f1(s.alt_max, ' m'));
  h += card('최대속도', f1(s.speed_max, ' m/s'));
  if (s.cur_max != null) {
    const cls = s.cur_max > 90 ? 'badc' : s.cur_max > 45 ? 'warnc' : '';
    h += card('최대전류', `<span class="${cls}">${f1(s.cur_max, ' A')}</span>`);
  }
  if (s.cell_min != null) h += card('셀 최저전압', f2(s.cell_min, ' V'));
  if (s.mah != null) h += card('이번 비행 소모', s.mah.toFixed(0) + ' mAh');
  if (s.sats != null) h += card('GPS', `위성 ${s.sats.toFixed(0)}개 · eph ${f2(s.eph)}`);
  if (s.vib_max != null) h += card('진동 최대', f1(s.vib_max));
  h += '</div>';

  if (s.findings && s.findings.length) {
    h += `<h2>문제 (${s.findings.length}건)</h2>`;
    for (const [cat, what, fix] of s.findings) {
      h += `<div class="finding"><div class="cat">${cat}</div><div>${esc(what)}</div>
            <div class="fix">→ ${esc(fix)}</div></div>`;
    }
  }
  if (s.good && s.good.length) {
    h += '<h2 style="margin-top:20px">잘 된 것</h2>';
    for (const g of s.good) h += `<div class="good">✅ ${esc(g)}</div>`;
  }
  if (s.msgs && s.msgs.length) {
    h += `<h2 style="margin-top:20px">FC 경고 (${s.msgs.length}건)</h2>`;
    for (const [ts, lvl, txt] of s.msgs) {
      const rt = ts - s.t0;
      const col = lvl === 'ERROR' ? 'badc' : 'warnc';
      h += `<div class="evt" data-t="${rt.toFixed(2)}">
            <span class="muted">${rt.toFixed(1)}s</span>
            <span class="${col}">[${lvl}]</span> ${esc(txt)}</div>`;
    }
  }
  if (s.innov && s.innov.length) {
    h += '<h2 style="margin-top:20px">EKF 이상 <span class="muted" style="font-weight:400;font-size:12px">' +
         'test ratio > 1.0 는 센서 불일치. 기동 중 gravity 초과는 흔하다</span></h2>';
    for (const [k, v] of s.innov.slice(0, 6)) {
      h += `<div class="evt">${esc(k)} <span class="muted">최대</span> ${v.toFixed(2)}</div>`;
    }
  }
  $('#report').innerHTML = h;
  document.querySelectorAll('.evt[data-t]').forEach((el) => el.onclick = () => {
    const t = parseFloat(el.dataset.t);
    // 확대 중이라면 그 시각이 화면 밖일 수 있다. 폭은 유지한 채 가운데로 옮긴다.
    if (VIEW && (t < VIEW.t0 || t > VIEW.t1)) {
      const w = VIEW.t1 - VIEW.t0;
      setView(t - w / 2, t + w / 2);
    }
    player.seek(t);
    document.querySelector('.wrap').scrollIntoView({ behavior: 'smooth' });
  });
}

// ── 시작 ─────────────────────────────────────────────────────────────
async function boot() {
  const [rs, rt] = await Promise.all([
    fetch(`/api/logs/${ID}/sum`), fetch(`/api/logs/${ID}/trk`),
  ]);
  if (!rs.ok) {
    const e = await rs.json().catch(() => ({}));
    $('#report').innerHTML = `<div class="warnbox">이 로그는 분석할 수 없다 — ${esc(e.error || rs.status)}</div>`;
    return;
  }
  SUM = await rs.json();
  TRK = await rt.json();

  const rows = await (await fetch('/api/logs')).json();
  const row = rows.find((r) => r.id === ID) || {};
  document.title = `${row.name || ''} — SHADE01`;
  LOGNAME = row.name || ID;

  let banners = '';
  if (SUM.repaired) banners += `<div class="warnbox">⚠️ 구독 섹션이 유실돼 <b>다른 로그의 정의를 이식해</b> 읽었다. 토픽·필드 해석이 어긋났을 수 있으니 수치를 정본으로 쓰지 마라.</div>`;
  if (SUM.corrupt) banners += `<div class="warnbox">⚠️ 중간에 깨진 구간이 있다. 그 구간 샘플이 빠져 비행시간·최대값이 실제보다 작을 수 있다.</div>`;
  if (SUM.armed === false) banners += `<div class="warnbox">⚠️ arm 구간이 없다. 로그 <b>전체 구간</b>으로 계산했다 — 지상 기록이다.</div>`;
  if (SUM.uuid && !String(SUM.uuid).startsWith(SHADE_UUID_PREFIX)) {
    banners += `<div class="warnbox">⚠️ <b>다른 기체의 로그다</b> (uuid ${esc(String(SUM.uuid).slice(0, 20))}…).
      전류 45/90A·진동 10/30·경사 45° 같은 판정 임계값은 SHADE 기준이라 이 기체에는 맞지 않을 수 있다.
      궤적·시계열은 그대로 믿어도 된다.</div>`;
  }
  if (banners) $('#banner').innerHTML = `<div style="padding:14px 20px 0">${banners}</div>`;

  // 🔴 buildCharts 가 격자와 함께 지도 셀(#map)을 만든다. initMap 이 먼저 돌면
  //    붙일 요소가 없다.
  buildCharts();
  initMap();
  drawTrack();
  initPlayer();
  drawReport();
  // ?t=113.5 로 특정 순간을 바로 열 수 있다. FC 경고를 남에게 보낼 때 쓴다.
  const t0 = parseFloat(new URLSearchParams(location.search).get('t'));
  player.seek(isFinite(t0) ? t0 : 0);


  let rt2;
  addEventListener('resize', () => { clearTimeout(rt2); rt2 = setTimeout(redraw, 150); });
}
boot();

</script>
